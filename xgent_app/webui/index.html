<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XGent Web Chat</title>
<script src="/vendor/telegram-web-app.js"></script>
<script src="/vendor/marked.umd.js"></script>
<link rel="stylesheet" href="/assets/chat.css">
<link rel="stylesheet" href="/assets/workbench.css">
<link rel="stylesheet" href="/assets/conversations.css">
<link rel="stylesheet" href="/assets/reading.css">
<link rel="stylesheet" href="/assets/knowledge.css">
</head>
<body data-page="chat">

<!-- SVG 精致图标库 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-menu"><path d="M3.5 7h17M3.5 12h17M3.5 17h11"/></g>
    <g id="i-moon"><path d="M20.2 14.6A8.4 8.4 0 1 1 9.4 3.8a6.8 6.8 0 0 0 10.8 10.8Z"/></g>
    <g id="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2.6v2M12 19.4v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.6 12h2M19.4 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>
    <g id="i-terminal"><rect x="2.7" y="4.2" width="18.6" height="15.6" rx="4"/><path d="m7.2 10 2.6 2.6-2.6 2.6M13.2 15.2h3.8"/></g>
    <g id="i-settings"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.1 14.6a1.5 1.5 0 0 0 .3 1.65l.05.06a1.85 1.85 0 1 1-2.62 2.62l-.05-.06a1.5 1.5 0 0 0-1.65-.3 1.5 1.5 0 0 0-.91 1.37v.16a1.85 1.85 0 0 1-3.7 0v-.09a1.5 1.5 0 0 0-.98-1.37 1.5 1.5 0 0 0-1.65.3l-.06.06a1.85 1.85 0 1 1-2.62-2.62l.06-.06a1.5 1.5 0 0 0 .3-1.65 1.5 1.5 0 0 0-1.37-.9h-.16a1.85 1.85 0 0 1 0-3.7h.09a1.5 1.5 0 0 0 1.37-.99 1.5 1.5 0 0 0-.3-1.65l-.06-.05a1.85 1.85 0 1 1 2.62-2.62l.06.05a1.5 1.5 0 0 0 1.65.3h.07a1.5 1.5 0 0 0 .91-1.37v-.16a1.85 1.85 0 1 1 3.7 0v.09a1.5 1.5 0 0 0 .91 1.37 1.5 1.5 0 0 0 1.65-.3l.05-.05a1.85 1.85 0 1 1 2.62 2.62l-.05.06a1.5 1.5 0 0 0-.3 1.65v.07a1.5 1.5 0 0 0 1.37.91h.16a1.85 1.85 0 0 1 0 3.7h-.09a1.5 1.5 0 0 0-1.37.91Z"/></g>
    <g id="i-attach"><path d="M20.6 11.4 12 20a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.85 1.85 0 0 1-2.6-2.6l7.9-7.9"/></g>
    <g id="i-send"><path d="M12 19.4V5.2M5.9 11.3 12 5.2l6.1 6.1"/></g>
    <g id="i-stop"><rect x="7" y="7" width="10" height="10" rx="2.6" fill="currentColor" stroke="none"/></g>
    <g id="i-close"><path d="M6.4 6.4 17.6 17.6M17.6 6.4 6.4 17.6"/></g>
    <g id="i-down"><path d="M12 4.8v14.4M6 13.2l6 6 6-6"/></g>
    <g id="i-up"><path d="M12 19.2V4.8M6 10.8l6-6 6 6"/></g>
    <g id="i-chev"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></g>
    <g id="i-copy"><rect x="9.2" y="9.2" width="11.3" height="11.3" rx="2.8"/><path d="M5.6 14.8H5a2.5 2.5 0 0 1-2.5-2.5V5a2.5 2.5 0 0 1 2.5-2.5h7.3A2.5 2.5 0 0 1 14.8 5v.6"/></g>
    <g id="i-check"><path d="m5 12.6 4.6 4.6L19 6.6"/></g>
    <g id="i-spark"><path d="M12 3.2 14 9.1l5.9 2-5.9 2-2 5.9-2-5.9-5.9-2 5.9-2 2-5.9Z"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></g>
    <g id="i-quote"><path d="M3 11V7a4 4 0 0 1 4-4h1M3 11a4 4 0 0 0 4 4h1v-4H3ZM13 11V7a4 4 0 0 1 4-4h1M13 11a4 4 0 0 0 4 4h1v-4h-5Z"/></g>
    <g id="i-speaker"><path d="M11 5 6 9H2v6h4l5 4V5ZM15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></g>
    <g id="i-wrap"><path d="M4 6h16M4 12h13a3 3 0 0 1 0 6H11m2-3-3 3 3 3M4 18h3"/></g>
    <g id="i-zoom-in"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></g>
    <g id="i-rotate"><path d="M21.5 2v6h-6M21.34 15.57a9 9 0 1 1-.57-8.38l6.67-5.19"/></g>
    <g id="i-external"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></g>
  </defs>
</svg>

<aside id="wb-nav" aria-label="对话与工作台">
  <div class="conv-brand-row">
    <a class="wb-brand" href="#/chat"><span class="wb-mark">x</span><span>XGent</span></a>
    <button id="conversation-drawer-close" class="conv-icon-button" type="button" aria-label="关闭对话列表" title="关闭对话列表"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <button id="conversation-new" class="conv-new" type="button" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 5.5 18.5.5l5 5-5 5M16 3 5 14l-1 6 6-1L21 8M12 4H5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h15a2 2 0 0 0 2-2v-7" transform="translate(1 0) scale(.86)"/></svg><span>新对话</span></button>
  <div class="conv-search-wrap">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
    <input id="conversation-search" type="search" aria-label="搜索对话" placeholder="搜索对话" autocomplete="off" spellcheck="false">
    <button id="conversation-search-clear" class="conv-icon-button" type="button" aria-label="清除对话搜索" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg></button>
  </div>
  <div class="conv-section-head"><h2 id="conversation-list-title">最近对话</h2><button id="conversation-view-back" type="button" hidden>返回最近</button></div>
  <div id="conversation-sync-error" class="conv-sync-error" role="status" hidden></div>
  <div id="conversation-scroll" class="conv-scroll">
    <div id="conversation-list" aria-labelledby="conversation-list-title" aria-busy="true"><p class="conv-list-hint">正在加载对话…</p></div>
  </div>
  <div class="workspace-dock">
    <button id="workspace-settings" type="button" aria-label="设置与工作台" aria-haspopup="menu" aria-controls="workspace-menu" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg><span>设置</span></button>
    <div id="workspace-menu" role="menu" aria-label="设置与工作台" hidden>
      <div class="workspace-menu-label">工作台</div>
      <nav id="wb-nav-links" aria-label="工作台导航"></nav>
      <div class="workspace-menu-label">对话与账户</div>
  <button id="conversation-archive-view" class="conv-archive-link" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v12H4zM3 4h18v4H3zM10 12h4"/></svg><span>已归档</span><span id="conversation-archive-count" class="conv-count" hidden></span></button>
      <button id="btn-search" type="button" role="menuitem" title="查找消息 (Ctrl+F)" aria-label="查找消息"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg><span>查找当前对话</span></button>
      <button id="btn-settings" type="button" role="menuitem" aria-label="偏好与安全"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg><span>偏好与安全</span></button>
      <button id="wb-logout" type="button" role="menuitem" aria-label="退出登录"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H4v16h6M14 8l4 4-4 4M8 12h10"/></svg><span>退出登录</span></button>
    </div>
  </div>
</aside>
<div id="conversation-backdrop" aria-hidden="true" hidden></div>
<div id="wb-shell">
<div id="header">
  <button id="conversation-drawer-toggle" class="conv-drawer-toggle icon-btn" type="button" aria-label="对话记录" title="展开或收起对话记录" aria-controls="wb-nav" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"/></svg></button>
  <div class="header-info"><div class="header-text">
    <h1 id="wb-conversation-title" title="新对话">新对话</h1><span id="wb-page-title" hidden></span>
    <div class="bot-status" id="status-text"><span class="conn-dot" id="conn-dot"></span> 在线</div>
    <span class="bot-name" hidden>XGent</span><span id="bot-avatar" hidden>X</span>
  </div><span id="conversation-current-status" class="conv-title-status" hidden>正在生成</span></div>
  <button id="btn-theme" class="icon-btn" type="button" title="切换主题" aria-label="切换主题"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-moon"/></svg></button>
  <button id="btn-terminal" class="icon-btn" type="button" title="终端" aria-label="终端"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-terminal"/></svg></button>
  <span class="model-pill" id="model-pill" hidden>AI</span>
</div>

<!-- 查找栏 -->
<div id="search-bar">
  <div class="search-input-wrap">
    <svg class="icon" viewBox="0 0 24 24"><use href="#i-search"/></svg>
    <input type="text" id="search-input" placeholder="在会话中搜索关键词…">
    <span class="search-count" id="search-count">0/0</span>
  </div>
  <div class="search-actions">
    <button class="search-btn" id="search-prev" title="上一条"><svg class="icon" viewBox="0 0 24 24"><use href="#i-up"/></svg></button>
    <button class="search-btn" id="search-next" title="下一条"><svg class="icon" viewBox="0 0 24 24"><use href="#i-down"/></svg></button>
    <button class="search-btn" id="search-close" title="关闭"><svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
  </div>
</div>

<section id="wb-chat" aria-label="对话">
<div id="conversation-running" class="conv-running" role="status" hidden></div>
<div id="wb-history-controls"><button id="wb-earlier">↑ 加载更早记录</button><button id="wb-newer" disabled>加载较新记录 ↓</button><span id="wb-history-state" role="status"></span><button id="wb-latest">回到最新 ↓</button></div>
<main id="log" aria-label="消息记录"></main>

<div id="empty-state" class="hidden">
  <div class="mark"><svg class="icon" viewBox="0 0 24 24"><use href="#i-spark"/></svg></div>
  <div class="title">把想法，变成行动。</div>
  <div class="desc">从一个问题开始，或让 Agent 帮你检查、构建和管理。所有结果在此汇聚。</div>
  <div class="chips">
    <button class="chip" type="button" data-cmd="/start">▶ 打开主菜单</button>
    <button class="chip" type="button" data-cmd="/status">ℹ 查看运行状态</button>
    <button class="chip" type="button" data-cmd="/show_chat_info">📊 状态与记忆统计</button>
    <button class="chip" type="button" data-cmd="/export">📦 导出记忆</button>
    <button class="chip" type="button" data-cmd="/compress">压缩上下文</button>
  </div>
</div>

<div id="source-navigation" role="status" hidden></div>
<div id="typing" class="hidden"><span></span><span></span><span></span></div>

<button id="scroll-bottom" title="滚动到底部" aria-label="滚动到底部"><svg class="icon" viewBox="0 0 24 24"><use href="#i-down"/></svg></button>

</section>
<section id="wb-page" tabindex="-1" hidden></section>
<!-- 全局拖拽遮罩 -->
<div id="drop-overlay">
  <div class="drop-box">
    <svg class="icon" viewBox="0 0 24 24"><use href="#i-attach"/></svg>
    <h3>释放文件以上传至 XGent</h3>
    <p>支持图片、音频、视频及各类文档</p>
  </div>
</div>

<!-- 图片全屏灯箱 -->
<div id="lightbox">
  <div class="lightbox-bar">
    <span class="lightbox-title" id="lightbox-filename">图片预览</span>
    <div class="lightbox-tools">
      <button class="lightbox-btn" id="lightbox-rotate" title="旋转 90°"><svg class="icon" viewBox="0 0 24 24"><use href="#i-rotate"/></svg></button>
      <a class="lightbox-btn" id="lightbox-dl" download title="下载原图"><svg class="icon" viewBox="0 0 24 24"><use href="#i-down"/></svg></a>
      <a class="lightbox-btn" id="lightbox-ext" target="_blank" rel="noopener noreferrer" title="新标签打开"><svg class="icon" viewBox="0 0 24 24"><use href="#i-external"/></svg></a>
      <button class="lightbox-btn" id="lightbox-close" title="关闭 (Esc)"><svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    </div>
  </div>
  <div class="lightbox-img-wrap">
    <img id="lightbox-img" src="" alt="预览图">
  </div>
</div>

<footer>
  <div id="composer">
    <div class="composer-card">
      <div id="pending-files" class="pending-files hidden"></div>
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="发送消息…" aria-label="消息"></textarea>
      </div>
      <div class="composer-row">
        <input type="file" id="file-input" class="hidden" multiple>
        <button id="btn-composer-menu" class="icon-btn" type="button" title="命令菜单 (Ctrl / ⌘ K)" aria-label="命令菜单" aria-expanded="false" aria-controls="composer-commands"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"/></svg></button>
        <button id="btn-attach" class="icon-btn" title="添加附件或拖入文件" aria-label="附件"><svg class="icon" viewBox="0 0 24 24"><use href="#i-attach"/></svg></button>
        <div id="wb-chat-controls" aria-label="模型与生成设置"></div>
        <button id="btn-send" class="send-btn" disabled title="发送消息 (Enter)" aria-label="发送"><svg class="icon" viewBox="0 0 24 24"><use href="#i-send"/></svg></button>
        <button id="btn-stop" class="stop-btn hidden" title="停止生成" aria-label="停止"><svg class="icon" viewBox="0 0 24 24"><use href="#i-stop"/></svg></button>
      </div>
    </div>
    <div id="composer-options-popover" aria-label="输入选项" hidden></div>
    <p id="composer-option-error" role="status" hidden></p>
    <section id="composer-commands" aria-label="命令列表" hidden></section>
    <div id="cmd-suggest" class="cmd-suggest hidden"></div>
  </div>
</footer>

<!-- 终端内嵌模态层 -->
<div id="terminal-modal">
  <div class="term-head">
    <button id="btn-close-terminal" class="icon-btn" title="返回聊天" aria-label="返回聊天"><svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    <strong>XGent 终端控制台</strong>
  </div>
  <iframe id="terminal-iframe" src="about:blank"></iframe>
</div>

<!-- 设置面板 -->
<div id="settings">
  <div class="settings-head">
    <button id="btn-close-settings" class="icon-btn" aria-label="返回"><svg class="icon" viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    <strong>XGent 设置中心</strong>
  </div>
  <div class="settings-body">
    <div class="section-label">对话与思考参数</div>
    <div class="card" id="settings-rows"></div>
    <p class="hint">配置改动即时生效并同步至 Telegram。模型提供商与 API Key 请在 Telegram 中管理。</p>
    <button id="btn-logout" class="btn-danger-row">退出登录</button>
  </div>
</div>

</div>
<aside id="wb-detail" aria-label="详情" hidden><div id="wb-resizer" role="separator" aria-label="调整详情宽度" tabindex="0"></div><header><span id="wb-detail-title">详情</span><button id="wb-detail-close" aria-label="关闭详情">×</button></header><div id="wb-detail-body"></div></aside>

<dialog id="wb-dialog" aria-labelledby="wb-dialog-title"><header><h2 id="wb-dialog-title"></h2><button id="wb-dialog-close" aria-label="关闭">×</button></header><div id="wb-dialog-body"></div></dialog>
<div id="conversation-item-menu" class="conv-item-menu" role="menu" aria-label="对话操作" hidden></div>
<dialog id="conversation-rename-dialog" class="conv-dialog" aria-labelledby="conversation-rename-title">
  <form id="conversation-rename-form">
    <div class="conv-dialog-heading"><h2 id="conversation-rename-title">重命名对话</h2><button id="conversation-rename-close" class="conv-icon-button" type="button" aria-label="关闭重命名"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <label for="conversation-rename-input">对话名称</label>
    <input id="conversation-rename-input" name="name" type="text" maxlength="80" required autocomplete="off">
    <p id="conversation-rename-error" role="alert" hidden></p>
    <div class="conv-dialog-actions"><button id="conversation-rename-cancel" type="button">取消</button><button id="conversation-rename-save" class="conv-save" type="submit">保存</button></div>
  </form>
</dialog>
<div id="conversation-feedback" class="conv-feedback" role="status" aria-live="polite" hidden></div>
<!-- 登录弹窗 -->
<dialog id="login">
  <div class="login-card">
    <div class="login-icon">X</div>
    <h2>XGent Web</h2>
    <p class="login-sub" id="login-sub">请输入访问密码以继续</p>
    <div class="err" id="login-err"></div>
    <input type="password" id="password" placeholder="访问密码" autocomplete="current-password">
    <button class="btn-primary" id="btn-login">登 录</button>
  </div>
  <div class="login-foot" id="login-foot">在 Telegram 中通过菜单按钮打开可免密直接登录</div>
</dialog>

<div id="toast"></div>

<script type="module" src="/assets/chat.js"></script>
<script type="module" src="/assets/conversations.js"></script>
<script type="module" src="/assets/workbench.js"></script>
</body>
</html>
