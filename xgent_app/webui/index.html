<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XGent Web Chat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #e6ebee;
    --wallpaper: #c5d3dc;
    --panel: #ffffff;
    --panel-2: #f1f3f5;
    --line: #d9dee3;
    --text: #0f1419;
    --muted: #708499;
    --accent: #3390ec;
    --accent-soft: #e7f1fc;
    --user: #effdde;
    --user-2: #d6f3c0;
    --ai: #ffffff;
    --danger: #e53935;
    --code-bg: #1e1f22;
    --code-fg: #e6e9ef;
    --radius: 16px;
    --header-h: 52px;
  }
  body.dark {
    --bg: #0e1621;
    --wallpaper: #17212b;
    --panel: #1c2733;
    --panel-2: #243341;
    --line: #2b3a47;
    --text: #e9edf0;
    --muted: #7d8e9e;
    --accent: #5288c1;
    --accent-soft: #1e3a5f;
    --user: #2b5278;
    --user-2: #1e3a5f;
    --ai: #1c2733;
    --danger: #e57676;
    --code-bg: #0e1621;
    --code-fg: #e9edf0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ---- 顶栏 ---- */
  #header {
    height: var(--header-h);
    display: flex; align-items: center; gap: 10px;
    padding: 0 12px; padding-top: env(safe-area-inset-top);
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0; z-index: 4;
  }
  #btn-menu, #btn-settings, #btn-terminal, #btn-theme {
    width: 36px; height: 36px; border: none; background: transparent;
    color: var(--muted); font-size: 20px; cursor: pointer; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  #btn-menu:hover, #btn-settings:hover, #btn-terminal:hover, #btn-theme:hover { background: var(--panel-2); color: var(--accent); }
  .header-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .bot-avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #5ca3f5, #3390ec);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 16px;
  }
  .bot-name { font-weight: 600; font-size: 15px; line-height: 1.2; }
  .bot-status { font-size: 12px; color: var(--muted); line-height: 1.2; }
  .bot-status.busy { color: var(--accent); }

  /* ---- 消息区 ---- */
  #log {
    flex: 1; overflow-y: auto; padding: 12px 8px 4px;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.5), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,.4), transparent 40%),
      var(--wallpaper);
    scroll-behavior: smooth;
  }
  .msg-row { display: flex; margin: 0 4px 6px; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.ai, .msg-row.sys { justify-content: flex-start; }
  .msg-row.sys { justify-content: center; }

  .bubble {
    max-width: min(560px, 78%); padding: 7px 11px 6px;
    position: relative; word-wrap: break-word; overflow-wrap: anywhere;
    box-shadow: 0 1px 1px rgba(0,0,0,.08);
    font-size: 15px;
  }
  .bubble.ai { background: var(--ai); border-radius: var(--radius) var(--radius) var(--radius) 5px; }
  .bubble.user { background: var(--user); border-radius: var(--radius) var(--radius) 5px var(--radius); }
  .bubble .ts {
    float: right; margin-left: 8px; margin-top: 4px;
    font-size: 11px; color: var(--muted); user-select: none; line-height: 1;
  }
  .bubble.user .ts { color: #5fb84b; }
  .bubble pre {
    background: var(--code-bg); color: var(--code-fg); padding: 9px 11px; border-radius: 10px;
    overflow-x: auto; margin: 6px 0; font: 13px/1.5 ui-monospace, "SF Mono", Consolas, monospace;
    position: relative;
  }
  .bubble code { background: rgba(0,0,0,.07); padding: 1px 5px; border-radius: 5px;
    font: 13px ui-monospace, "SF Mono", Consolas, monospace; }
  body.dark .bubble code { background: rgba(255,255,255,.08); }
  .bubble pre code { background: transparent; padding: 0; }
  .bubble a { color: var(--accent); }
  .bubble blockquote { margin: 4px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
  .copy-code-btn {
    position: absolute; top: 4px; right: 4px; opacity: 0; transition: opacity .15s;
    background: rgba(255,255,255,.12); color: var(--code-fg); border: none; border-radius: 6px;
    padding: 3px 8px; font-size: 11px; cursor: pointer; line-height: 1;
  }
  .bubble pre:hover .copy-code-btn { opacity: 1; }
  .copy-code-btn:hover { background: rgba(255,255,255,.22); }

  .sys-pill {
    background: rgba(0,0,0,.12); color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.2);
    padding: 5px 12px; border-radius: 14px; font-size: 13px; max-width: 80%;
    text-align: center; white-space: pre-wrap; word-wrap: break-word;
  }

  /* ---- 内联按钮 ---- */
  .inline-keyboard { margin-top: 6px; display: flex; flex-direction: column; gap: 5px; }
  .ik-row { display: flex; gap: 5px; }
  .ik-btn {
    flex: 1; padding: 8px 6px; font: inherit; font-size: 14px;
    background: var(--panel-2); color: var(--accent);
    border: none; border-radius: 9px; cursor: pointer; transition: background .12s;
  }
  .ik-btn:hover:not(:disabled) { background: var(--accent-soft); }
  .ik-btn:disabled { opacity: .55; cursor: default; }
  .ik-btn.loading { background: var(--accent-soft); }

  /* ---- 输入中 ---- */
  #typing {
    display: flex; gap: 4px; padding: 8px 14px; margin: 0 8px 4px;
    background: var(--ai); border-radius: var(--radius) var(--radius) var(--radius) 5px;
    width: fit-content; box-shadow: 0 1px 1px rgba(0,0,0,.08);
  }
  #typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  #typing span:nth-child(2) { animation-delay: .2s; }
  #typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  .hidden { display: none !important; }

  /* ---- 输入栏 ---- */
  footer { flex-shrink: 0; background: var(--panel); border-top: 1px solid var(--line);
           padding: 8px 10px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  #btn-attach { width: 38px; height: 38px; border: none; background: transparent;
    font-size: 20px; color: var(--muted); cursor: pointer; border-radius: 50%; flex-shrink: 0; }
  #btn-attach:hover { background: var(--panel-2); }
  .input-wrap { flex: 1; position: relative; }
  textarea {
    width: 100%; resize: none; min-height: 38px; max-height: 160px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 19px; padding: 9px 14px;
    font: inherit; line-height: 1.4;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .send-btn, .stop-btn {
    width: 42px; height: 42px; border: none; border-radius: 50%; cursor: pointer;
    flex-shrink: 0; color: #fff; font-size: 17px; display: flex; align-items: center; justify-content: center;
  }
  .send-btn { background: var(--accent); }
  .send-btn:disabled { background: var(--line); cursor: default; }
  .stop-btn { background: var(--danger); font-size: 14px; }

  /* ---- /命令补全 ---- */
  .cmd-suggest {
    position: absolute; bottom: 100%; left: 0; right: 0; margin-bottom: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,.14); max-height: 240px; overflow-y: auto; z-index: 6;
  }
  .cmd-item { display: flex; gap: 10px; padding: 9px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .cmd-item:last-child { border-bottom: none; }
  .cmd-item:hover, .cmd-item.active { background: var(--accent-soft); }
  .cmd-item .c-cmd { font-weight: 600; color: var(--accent); white-space: nowrap; }
  .cmd-item .c-desc { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }

  /* ---- 侧滑命令菜单 ---- */
  .side-panel {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(320px, 84vw);
    background: var(--panel); z-index: 20; transform: translateX(-100%);
    transition: transform .22s ease; display: flex; flex-direction: column;
    box-shadow: 2px 0 16px rgba(0,0,0,.12);
  }
  .side-panel.open { transform: translateX(0); }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 15; }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line); font-weight: 600;
  }
  .panel-header button { width: 32px; height: 32px; border: none; background: transparent;
    font-size: 18px; color: var(--muted); cursor: pointer; border-radius: 50%; }
  .panel-header button:hover { background: var(--panel-2); }
  .cmd-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .menu-item { display: flex; flex-direction: column; gap: 2px; padding: 11px 16px; cursor: pointer; }
  .menu-item:hover { background: var(--panel-2); }
  .menu-item .m-cmd { font-weight: 600; color: var(--accent); font-size: 14px; }
  .menu-item .m-desc { color: var(--muted); font-size: 12px; }

  /* ---- 设置面板 ---- */
  #settings { position: fixed; inset: 0; background: var(--bg); z-index: 25; overflow-y: auto;
              display: none; }
  #settings.open { display: block; }
  .settings-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    padding-top: max(12px, env(safe-area-inset-top)); background: var(--panel);
    border-bottom: 1px solid var(--line); position: sticky; top: 0;
  }
  .settings-head strong { flex: 1; font-size: 16px; }
  .row {
    display: flex; align-items: center; gap: 10px; justify-content: space-between;
    padding: 12px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .row label { color: var(--text); font-size: 14px; }
  .row select, .row input[type=number] {
    background: var(--panel-2); color: var(--text); font: inherit;
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 140px;
  }
  .hint { color: var(--muted); font-size: 12px; margin: 12px 14px; }
  .btn-text { background: transparent; border: none; color: var(--accent); font: inherit; cursor: pointer; padding: 12px 14px; }

  /* ---- 终端模态层（内嵌 iframe，避免跳转外部浏览器） ---- */
  #terminal-modal { position: fixed; inset: 0; background: var(--bg); z-index: 30; display: none;
                    flex-direction: column; }
  #terminal-modal.open { display: flex; }
  #terminal-modal .term-head {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    padding-top: max(8px, env(safe-area-inset-top)); background: var(--panel);
    border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  #terminal-modal .term-head strong { flex: 1; font-size: 15px; }
  #terminal-modal .term-head button { width: 36px; height: 36px; border: none; background: transparent;
    color: var(--muted); font-size: 20px; cursor: pointer; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; }
  #terminal-modal .term-head button:hover { background: var(--panel-2); color: var(--accent); }
  #terminal-iframe { flex: 1; width: 100%; border: none; background: #000; }

  /* ---- 登录 / toast ---- */
  dialog {
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--panel); color: var(--text);
    padding: 22px; max-width: 90vw; width: 340px;
  }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h2 { margin: 0 0 14px; font-size: 17px; }
  dialog input {
    width: 100%; padding: 10px 12px; margin-bottom: 12px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; font: inherit;
  }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 8px; }
  .btn-primary { background: var(--accent); color: #fff; border: none; border-radius: 9px;
    padding: 10px 14px; font: inherit; cursor: pointer; width: 100%; }
  #toast {
    position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
    background: rgba(0,0,0,.82); color: #fff; padding: 9px 16px; border-radius: 18px;
    font-size: 13px; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 88vw;
  }
  #toast.show { opacity: 1; }

  /* ---- 滚动到底部按钮 ---- */
  #scroll-bottom {
    position: fixed; right: 16px; bottom: 72px; width: 40px; height: 40px;
    border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
    color: var(--accent); font-size: 18px; cursor: pointer; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; transform: translateY(8px);
  }
  #scroll-bottom.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  #scroll-bottom:hover { background: var(--panel-2); }

  /* ---- 空状态 ---- */
  #empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--muted); text-align: center; gap: 8px; padding: 20px;
  }
  #empty-state .emoji { font-size: 42px; opacity: .7; }
  #empty-state .title { font-size: 16px; font-weight: 600; color: var(--text); }
  #empty-state .desc { font-size: 13px; max-width: 260px; line-height: 1.5; }

  /* ---- 连接状态指示 ---- */
  .conn-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 4px; vertical-align: middle;
    background: #4caf50; transition: background .2s;
  }
  .conn-dot.connecting { background: #ff9800; animation: pulse 1s infinite; }
  .conn-dot.disconnected { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .4; } }
</style>
</head>
<body>

<div id="header">
  <button id="btn-menu" title="命令菜单">≡</button>
  <div class="header-info">
    <div class="bot-avatar">X</div>
    <div>
      <div class="bot-name">XGent</div>
      <div class="bot-status" id="status-text"><span class="conn-dot" id="conn-dot"></span> 在线</div>
    </div>
  </div>
  <button id="btn-theme" title="切换深色模式">🌙</button>
  <button id="btn-terminal" title="终端">🖥</button>
  <button id="btn-settings" title="设置">⚙️</button>
</div>

<main id="log"></main>
<div id="empty-state" class="hidden">
  <div class="emoji">💬</div>
  <div class="title">开始对话</div>
  <div class="desc">在下方输入消息，或点击左上角 ≡ 查看可用命令。</div>
</div>
<div id="typing" class="hidden"><span></span><span></span><span></span></div>
<button id="scroll-bottom" title="滚动到底部">↓</button>

<footer>
  <div class="composer">
    <button id="btn-attach" title="附件">📎</button>
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="消息 XGent…（Enter 发送，Shift+Enter 换行）"></textarea>
      <div id="cmd-suggest" class="cmd-suggest hidden"></div>
    </div>
    <button id="btn-send" class="send-btn" title="发送">➤</button>
    <button id="btn-stop" class="stop-btn hidden" title="停止">■</button>
  </div>
</footer>

<!-- 命令菜单侧栏 -->
<aside id="menu-panel" class="side-panel">
  <div class="panel-header">命令菜单<button id="btn-close-menu">✕</button></div>
  <div class="cmd-list" id="cmd-list"></div>
</aside>
<div id="overlay" class="hidden"></div>

<!-- 终端模态层：内嵌 iframe，避免在 Telegram webview 中跳转外部浏览器 -->
<div id="terminal-modal">
  <div class="term-head">
    <strong>终端</strong>
    <button id="btn-close-terminal" title="返回聊天">✕</button>
  </div>
  <iframe id="terminal-iframe" src="about:blank"></iframe>
</div>

<!-- 设置面板 -->
<div id="settings">
  <div class="settings-head">
    <strong>设置</strong>
    <button id="btn-close-settings" class="btn-text">返回</button>
  </div>
  <div id="settings-rows"></div>
  <div class="hint">改动即时保存，与 Telegram 菜单共用同一份配置。提供商与 API Key 请在 Telegram 里管理。</div>
  <div style="padding:6px 14px 40px"><button id="btn-logout" class="btn-text" style="color:var(--danger)">退出登录</button></div>
</div>

<!-- 登录 -->
<dialog id="login">
  <h2>需要登录</h2>
  <div class="err" id="login-err"></div>
  <input type="password" id="password" placeholder="访问密码" autocomplete="current-password">
  <button class="btn-primary" id="btn-login">登录</button>
</dialog>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  var log = document.getElementById("log");
  var input = document.getElementById("input");
  var btnSend = document.getElementById("btn-send");
  var btnStop = document.getElementById("btn-stop");
  var btnAttach = document.getElementById("btn-attach");
  var typing = document.getElementById("typing");
  var statusText = document.getElementById("status-text");
  var connDot = document.getElementById("conn-dot");
  var loginDlg = document.getElementById("login");
  var loginErr = document.getElementById("login-err");
  var settings = document.getElementById("settings");
  var settingsRows = document.getElementById("settings-rows");
  var menuPanel = document.getElementById("menu-panel");
  var overlay = document.getElementById("overlay");
  var suggest = document.getElementById("cmd-suggest");
  var toastEl = document.getElementById("toast");
  var scrollBtn = document.getElementById("scroll-bottom");
  var emptyState = document.getElementById("empty-state");
  var btnTheme = document.getElementById("btn-theme");

  var byMessageId = {};   // message_id -> { wrap, body, btns }
  var evtSource = null;
  var suggestIndex = -1;
  var reconnectTimer = null;
  var reconnectDelay = 1000;
  var msgCount = 0;

  // ---- 深色模式 ----
  if (localStorage.getItem("xgent-theme") === "dark") {
    document.body.classList.add("dark");
    btnTheme.textContent = "☀️";
  }
  btnTheme.addEventListener("click", function () {
    var isDark = document.body.classList.toggle("dark");
    btnTheme.textContent = isDark ? "☀️" : "🌙";
    localStorage.setItem("xgent-theme", isDark ? "dark" : "light");
  });

  // 与 Telegram 注册的命令一致（lifecycle.py setup_bot_commands）。
  var COMMANDS = [
    {cmd:"/start", desc:"打开主菜单"},
    {cmd:"/config", desc:"打开设置面板"},
    {cmd:"/status", desc:"查看状态"},
    {cmd:"/show_chat_info", desc:"状态与记忆统计"},
    {cmd:"/clear_memory", desc:"清空上下文"},
    {cmd:"/agent", desc:"开关 Agent 模式"},
    {cmd:"/stream", desc:"开关流式输出"},
    {cmd:"/thinking", desc:"设置思考深度"},
    {cmd:"/depth", desc:"设置记忆深度"},
    {cmd:"/timeout", desc:"设置超时"},
    {cmd:"/models", desc:"选择默认模型"},
    {cmd:"/chat_model", desc:"选择对话模型"},
    {cmd:"/media_model", desc:"选择媒体模型"},
    {cmd:"/providers", desc:"管理提供商"},
    {cmd:"/provider_config", desc:"导入导出配置"},
    {cmd:"/prompts", desc:"管理提示词"},
    {cmd:"/web", desc:"配置网页版"},
    {cmd:"/blacklist", desc:"命令黑名单"},
    {cmd:"/export", desc:"导出记忆"},
    {cmd:"/update", desc:"更新代码"},
    {cmd:"/restart", desc:"重启 Bot"}
  ];

  // ---- 工具 ----
  function api(path, options) {
    options = options || {};
    options.credentials = "same-origin";
    options.headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
    return fetch(path, options).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (body) {
        if (!r.ok) { throw new Error(body.error || ("HTTP " + r.status)); }
        return body;
      });
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // 安全渲染 bot 的 HTML：只放行白名单标签，剥离其余标签与危险属性。
  var ALLOWED = { B:1, STRONG:1, I:1, EM:1, U:1, INS:1, S:1, STRIKE:1, DEL:1, CODE:1, PRE:1, BR:1, A:1, BLOCKQUOTE:1 };
  function sanitizeHtml(html) {
    var tmp = document.createElement("div");
    tmp.innerHTML = String(html);
    (function clean(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (c) {
        if (c.nodeType === 3) return;                 // 文本节点保留
        if (c.nodeType !== 1) { node.removeChild(c); return; }
        if (!ALLOWED[c.tagName]) {
          var frag = document.createDocumentFragment();
          while (c.firstChild) frag.appendChild(c.firstChild);
          c.parentNode.replaceChild(frag, c);
          return;
        }
        Array.prototype.slice.call(c.attributes).forEach(function (a) {
          if (c.tagName === "A" && a.name === "href") {
            if (!/^(https?:|mailto:)/i.test(a.value)) c.removeAttribute(a.name);
          } else if (c.tagName === "A" && (a.name === "target" || a.name === "rel")) {
            /* 保留，下面统一设置 */
          } else {
            c.removeAttribute(a.name);
          }
        });
        if (c.tagName === "A") { c.target = "_blank"; c.rel = "noopener noreferrer"; }
        clean(c);
      });
    })(tmp);
    return tmp.innerHTML;
  }

  function renderText(text, parseMode) {
    text = text == null ? "" : String(text);
    if (parseMode && String(parseMode).toUpperCase().indexOf("HTML") >= 0) {
      return sanitizeHtml(text);
    }
    // 纯文本：转义后还原代码块与换行。
    var out = escapeHtml(text);
    out = out.replace(/```([\s\S]*?)```/g, function (_, code) { return "<pre>" + code.replace(/^\n/, "") + "</pre>"; });
    out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    out = out.replace(/\n/g, "<br>");
    return out;
  }

  function nowTime() {
    var d = new Date();
    return (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();
  }

  function toast(msg, alert) {
    if (!msg) return;
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(function () { toastEl.classList.remove("show"); }, alert ? 2600 : 1800);
  }

  function scrollDown() { log.scrollTop = log.scrollHeight; hideScrollBtn(); }

  function isNearBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 80; }
  function hideScrollBtn() { scrollBtn.classList.remove("show"); }
  function showScrollBtn() { scrollBtn.classList.add("show"); }

  function updateEmptyState() {
    if (msgCount === 0) { emptyState.classList.remove("hidden"); }
    else { emptyState.classList.add("hidden"); }
  }

  // 给 pre 块注入复制按钮
  function injectCopyButtons(container) {
    var pres = container.querySelectorAll("pre");
    pres.forEach(function (pre) {
      if (pre.querySelector(".copy-code-btn")) return;
      var btn = document.createElement("button");
      btn.className = "copy-code-btn";
      btn.textContent = "复制";
      btn.addEventListener("click", function () {
        var code = pre.querySelector("code");
        var text = code ? code.textContent : pre.textContent;
        navigator.clipboard.writeText(text).then(function () {
          btn.textContent = "已复制";
          setTimeout(function () { btn.textContent = "复制"; }, 1500);
        }).catch(function () {
          toast("复制失败");
        });
      });
      pre.appendChild(btn);
    });
  }

  // ---- 气泡渲染 ----
  function makeBubble(role, text, messageId, parseMode, markup) {
    msgCount++;
    updateEmptyState();
    var row = document.createElement("div");
    row.className = "msg-row " + role;
    if (role === "sys") {
      var pill = document.createElement("div");
      pill.className = "sys-pill";
      pill.innerHTML = renderText(text, parseMode);
      row.appendChild(pill);
      log.appendChild(row);
      scrollDown();
      return { row: row, body: pill, btns: null };
    }
    var bubble = document.createElement("div");
    bubble.className = "bubble " + role;
    var body = document.createElement("div");
    body.className = "body";
    body.innerHTML = renderText(text, parseMode);
    injectCopyButtons(body);
    var ts = document.createElement("span");
    ts.className = "ts";
    ts.textContent = nowTime();
    bubble.appendChild(body);
    bubble.appendChild(ts);
    var btns = null;
    if (markup && markup.length) { btns = renderButtons(markup, messageId); bubble.appendChild(btns); }
    row.appendChild(bubble);
    log.appendChild(row);
    scrollDown();
    var entry = { row: row, body: body, btns: btns };
    if (messageId != null) { byMessageId[messageId] = entry; }
    return entry;
  }

  function renderButtons(rows, messageId) {
    var container = document.createElement("div");
    container.className = "inline-keyboard";
    rows.forEach(function (row) {
      var rowEl = document.createElement("div");
      rowEl.className = "ik-row";
      row.forEach(function (btn) {
        if (!btn.callback_data) return;   // url/web_app 按钮在网页无意义，跳过
        var b = document.createElement("button");
        b.className = "ik-btn";
        b.textContent = btn.text;
        b.addEventListener("click", function () {
          if (b.disabled) return;
          b.disabled = true; b.classList.add("loading");
          api("/api/callback", { method: "POST", body: JSON.stringify({ callback_data: btn.callback_data, message_id: messageId }) })
            .catch(function (err) { toast(err.message); })
            .finally(function () { setTimeout(function () { b.disabled = false; b.classList.remove("loading"); }, 350); });
        });
        rowEl.appendChild(b);
      });
      if (rowEl.childNodes.length) container.appendChild(rowEl);
    });
    return container.childNodes.length ? container : null;
  }

  function setButtons(entry, markup, messageId) {
    if (entry.btns && entry.btns.parentNode) entry.btns.parentNode.removeChild(entry.btns);
    entry.btns = null;
    if (markup && markup.length) {
      entry.btns = renderButtons(markup, messageId);
      if (entry.btns) entry.row.querySelector(".bubble").appendChild(entry.btns);
    }
  }

  // ---- 状态 ----
  function setBusy(busy) {
    btnSend.disabled = busy;
    btnSend.classList.toggle("hidden", busy);
    btnStop.classList.toggle("hidden", !busy);
    if (busy) {
      statusText.innerHTML = '<span class="conn-dot"></span> 正在输入…';
    } else {
      setConnState(currentConnState);
    }
    statusText.classList.toggle("busy", busy);
    if (busy) showTyping(); else hideTyping();
  }
  function showTyping() { typing.classList.remove("hidden"); scrollDown(); }
  function hideTyping() { typing.classList.add("hidden"); }

  // ---- SSE 帧处理 ----
  function handleFrame(frame) {
    if (frame.type === "message") {
      makeBubble("ai", frame.text, frame.message_id, frame.parse_mode, frame.reply_markup);
      hideTyping();
    } else if (frame.type === "edit") {
      var e = byMessageId[frame.message_id];
      if (e) {
        e.body.innerHTML = renderText(frame.text, frame.parse_mode);
        injectCopyButtons(e.body);
        if (frame.reply_markup !== undefined) setButtons(e, frame.reply_markup, frame.message_id);
      } else {
        makeBubble("ai", frame.text, frame.message_id, frame.parse_mode, frame.reply_markup);
      }
      scrollDown();
    } else if (frame.type === "edit_markup") {
      var em = byMessageId[frame.message_id];
      if (em) setButtons(em, frame.reply_markup, frame.message_id);
    } else if (frame.type === "delete") {
      var d = byMessageId[frame.message_id];
      if (d && d.row && d.row.parentNode) d.row.parentNode.removeChild(d.row);
      delete byMessageId[frame.message_id];
      msgCount = Math.max(0, msgCount - 1);
      updateEmptyState();
    } else if (frame.type === "user_message") {
      // Telegram 侧发来的用户消息，镜像到网页
      makeBubble("user", frame.text, null, null, null);
      hideTyping();
    } else if (frame.type === "document" || frame.type === "photo") {
      makeBubble("sys", (frame.type === "document" ? "📎 " : "🖼️ ") +
        (frame.filename || (frame.type === "photo" ? "图片" : "文件")) +
        (frame.caption ? "\n" + frame.caption : ""), frame.message_id, null, null);
    } else if (frame.type === "chat_action") {
      if (frame.action === "typing") showTyping(); else hideTyping();
    } else if (frame.type === "callback_answer") {
      toast(frame.text, frame.show_alert);
    } else if (frame.type === "turn_end") {
      setBusy(false);
    } else if (frame.type === "turn_error") {
      makeBubble("sys", "⚠️ " + (frame.text || "处理失败"));
      setBusy(false);
    }
  }

  var currentConnState = "";

  function setConnState(state) {
    currentConnState = state || "";
    connDot.className = "conn-dot" + (state ? " " + state : "");
    if (state === "connecting") statusText.innerHTML = '<span class="conn-dot connecting"></span> 连接中…';
    else if (state === "disconnected") statusText.innerHTML = '<span class="conn-dot disconnected"></span> 已断开，重连中…';
    else statusText.innerHTML = '<span class="conn-dot"></span> 在线';
  }

  function connectStream() {
    if (evtSource) evtSource.close();
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    setConnState("connecting");
    evtSource = new EventSource("/api/stream");
    evtSource.onopen = function () { setConnState(); reconnectDelay = 1000; };
    evtSource.onmessage = function (e) {
      try { handleFrame(JSON.parse(e.data)); } catch (err) {}
    };
    evtSource.onerror = function () {
      setBusy(false);
      setConnState("disconnected");
      evtSource.close();
      // 指数退避重连，上限 30 秒
      reconnectTimer = setTimeout(function () {
        reconnectDelay = Math.min(reconnectDelay * 1.5, 30000);
        connectStream();
      }, reconnectDelay);
    };
  }

  function loadHistory() {
    return api("/api/history?limit=50").then(function (data) {
      log.innerHTML = "";
      byMessageId = {};
      msgCount = 0;
      (data.messages || []).forEach(function (m) {
        var role = m.role === "user" ? "user" : (m.role === "assistant" ? "ai" : "sys");
        makeBubble(role, m.content);
      });
      if (msgCount === 0) updateEmptyState();
      scrollDown();
    });
  }

  // ---- 发送 ----
  function send() {
    var text = input.value.trim();
    if (!text || btnSend.disabled) return;
    makeBubble("user", text);            // 本地先显示用户气泡
    input.value = "";
    input.style.height = "auto";
    hideSuggest();
    setBusy(true);
    var isCmd = text.charAt(0) === "/";
    var path = isCmd ? "/api/command" : "/api/chat";
    var body = isCmd ? { command: text } : { text: text };
    api(path, { method: "POST", body: JSON.stringify(body) }).catch(function (err) {
      makeBubble("sys", "⚠️ " + err.message);
      setBusy(false);
    });
  }

  // ---- / 命令补全 ----
  function showSuggest(q) {
    var prefix = q.toLowerCase();
    var matches = COMMANDS.filter(function (c) { return c.cmd.toLowerCase().indexOf(prefix) === 0; });
    if (!matches.length) { hideSuggest(); return; }
    suggest.innerHTML = "";
    matches.slice(0, 6).forEach(function (c, i) {
      var item = document.createElement("div");
      item.className = "cmd-item";
      item.innerHTML = '<span class="c-cmd">' + escapeHtml(c.cmd) + "</span><span class=\"c-desc\">" + escapeHtml(c.desc) + "</span>";
      item.addEventListener("click", function () {
        input.value = c.cmd + " ";
        input.focus();
        hideSuggest();
        input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px";
      });
      item.dataset.idx = i;
      suggest.appendChild(item);
    });
    suggestIndex = -1;
    suggest.classList.remove("hidden");
  }
  function hideSuggest() { suggest.classList.add("hidden"); suggestIndex = -1; }

  // ---- 设置 ----
  var SETTING_FIELDS = [
    { key: "thinking_level", label: "思考深度", type: "select" },
    { key: "stream_mode", label: "流式输出", type: "bool" },
    { key: "agent_mode", label: "Agent 模式", type: "bool" },
    { key: "text_stitch_mode", label: "文字拼接", type: "select" },
    { key: "global_depth", label: "记忆深度", type: "number", min: 1, max: 500 },
    { key: "agent_max_iterations", label: "Agent 最大轮数", type: "number", min: 1, max: 50 },
    { key: "stream_timeout", label: "回复超时(秒, 0=不限)", type: "number", min: 0, max: 3600 },
    { key: "chat_model", label: "对话模型", type: "select" }
  ];
  function loadSettings() {
    return api("/api/config").then(function (data) {
      settingsRows.innerHTML = "";
      SETTING_FIELDS.forEach(function (field) {
        if (!(field.key in data.values)) return;
        var row = document.createElement("div");
        row.className = "row";
        var label = document.createElement("label");
        label.textContent = field.label;
        row.appendChild(label);
        var control;
        if (field.type === "bool") {
          control = document.createElement("select");
          [["true", "开"], ["false", "关"]].forEach(function (pair) {
            var o = document.createElement("option"); o.value = pair[0]; o.textContent = pair[1]; control.appendChild(o);
          });
          control.value = data.values[field.key] ? "true" : "false";
        } else if (field.type === "select") {
          control = document.createElement("select");
          (data.options[field.key] || []).forEach(function (opt) {
            var o = document.createElement("option"); o.value = opt.value; o.textContent = opt.label; control.appendChild(o);
          });
          control.value = String(data.values[field.key]);
        } else {
          control = document.createElement("input");
          control.type = "number";
          if (field.min != null) control.min = field.min;
          if (field.max != null) control.max = field.max;
          control.value = data.values[field.key];
        }
        control.addEventListener("change", function () {
          var value = control.value;
          if (field.type === "bool") value = control.value === "true";
          else if (field.type === "number") value = Number(control.value);
          api("/api/config", { method: "POST", body: JSON.stringify({ key: field.key, value: value }) })
            .catch(function (err) { toast("保存失败：" + err.message); loadSettings(); });
        });
        row.appendChild(control);
        settingsRows.appendChild(row);
      });
    });
  }

  // ---- 命令菜单侧栏 ----
  function buildMenu() {
    var list = document.getElementById("cmd-list");
    list.innerHTML = "";
    COMMANDS.forEach(function (c) {
      var item = document.createElement("div");
      item.className = "menu-item";
      item.innerHTML = '<span class="m-cmd">' + escapeHtml(c.cmd) + "</span><span class=\"m-desc\">" + escapeHtml(c.desc) + "</span>";
      item.addEventListener("click", function () {
        closeMenu();
        input.value = c.cmd + " ";
        input.focus();
        input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px";
      });
      list.appendChild(item);
    });
  }
  function openMenu() { menuPanel.classList.add("open"); overlay.classList.remove("hidden"); }
  function closeMenu() { menuPanel.classList.remove("open"); overlay.classList.add("hidden"); }

  // ---- 启动 ----
  function boot() {
    loginDlg.close();
    buildMenu();
    connectStream();
    loadHistory().catch(function () {});
  }
  function tryLogin(payload) { return api("/api/login", { method: "POST", body: JSON.stringify(payload) }); }

  api("/api/session").then(function (data) {
    if (data.authenticated) { boot(); return; }
    var initData = tg && tg.initData ? tg.initData : "";
    if (initData) {
      return tryLogin({ init_data: initData }).then(boot).catch(function () { loginDlg.showModal(); });
    }
    loginDlg.showModal();
  }).catch(function () { loginDlg.showModal(); });

  // ---- 事件绑定 ----
  document.getElementById("btn-login").addEventListener("click", function () {
    loginErr.textContent = "";
    tryLogin({ password: document.getElementById("password").value })
      .then(boot).catch(function (err) { loginErr.textContent = err.message; });
  });
  document.getElementById("password").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("btn-login").click();
  });

  btnSend.addEventListener("click", send);
  input.addEventListener("keydown", function (e) {
    if (suggest.classList.contains("hidden")) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
      return;
    }
    // 补全菜单激活时：上下选择 / Enter 确认 / Esc 关闭
    var items = suggest.querySelectorAll(".cmd-item");
    if (e.key === "ArrowDown") { e.preventDefault(); suggestIndex = Math.min(suggestIndex + 1, items.length - 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); suggestIndex = Math.max(suggestIndex - 1, 0); }
    else if (e.key === "Enter") {
      e.preventDefault();
      if (suggestIndex >= 0 && items[suggestIndex]) { items[suggestIndex].click(); return; }
      hideSuggest(); send(); return;
    } else if (e.key === "Escape") { hideSuggest(); return; }
    else { return; }
    items.forEach(function (it, i) { it.classList.toggle("active", i === suggestIndex); });
  });
  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
    var val = input.value;
    var slash = val.lastIndexOf("/");
    if (slash === 0 && val.indexOf(" ") < 0) { showSuggest(val); }
    else { hideSuggest(); }
  });

  btnStop.addEventListener("click", function () { api("/api/stop", { method: "POST" }).catch(function () {}); });
  btnAttach.addEventListener("click", function () { toast("附件上传请在 Telegram 中发送文件"); });

  // 滚动检测 & 滚动到底部按钮
  log.addEventListener("scroll", function () {
    if (isNearBottom()) hideScrollBtn(); else showScrollBtn();
  });
  scrollBtn.addEventListener("click", function () { scrollDown(); });

  document.getElementById("btn-menu").addEventListener("click", openMenu);
  document.getElementById("btn-close-menu").addEventListener("click", closeMenu);
  overlay.addEventListener("click", closeMenu);

  document.getElementById("btn-terminal").addEventListener("click", function () {
    // 在当前页面内嵌 iframe 打开终端，避免 Telegram webview 跳转外部浏览器，
    // 同时保留聊天页面状态。关闭即回到聊天。
    var modal = document.getElementById("terminal-modal");
    var iframe = document.getElementById("terminal-iframe");
    if (iframe.dataset.loaded !== "1") {
      iframe.src = "/terminal";
      iframe.dataset.loaded = "1";
    }
    modal.classList.add("open");
  });
  document.getElementById("btn-close-terminal").addEventListener("click", function () {
    document.getElementById("terminal-modal").classList.remove("open");
  });
  // iframe 内的 terminal.html 点"返回聊天"时，postMessage 通知关闭模态层
  window.addEventListener("message", function (event) {
    if (event.data && event.data.type === "xgent-close-terminal") {
      document.getElementById("terminal-modal").classList.remove("open");
    }
  });

  document.getElementById("btn-settings").addEventListener("click", function () {
    settings.classList.add("open");
    loadSettings().catch(function (err) { toast("读取配置失败：" + err.message); });
  });
  document.getElementById("btn-close-settings").addEventListener("click", function () { settings.classList.remove("open"); });
  document.getElementById("btn-logout").addEventListener("click", function () {
    api("/api/logout", { method: "POST" }).then(function () { location.reload(); });
  });
})();
</script>
</body>
</html>
