    { key: "stats_auto_merge", label: "统计：相同模型自动合并", type: "bool" },
    { key: "stats_metric", label: "统计：默认指标", type: "select" },
    { key: "model_price_table", label: "💵 模型价格表（每百万 token / USD）", type: "price_table" },
    { key: "model_merge_map", label: "🔗 手动模型合并表", type: "merge_map" }
  ];
  function saveSetting(key, value) {
    return api("/api/config", { method: "POST", body: JSON.stringify({ key: key, value: value }) })
      .catch(function (err) { toast("保存失败：" + err.message); loadSettings(); });
  }
  // 价格表 / 合并表 编辑器：本地草稿模式，改动暂存，点保存才提交。
  // 避免每个输入框失焦就 POST，减少抖动；也方便用户在多个模型间来回调整。
  function renderPriceTableEditor(row, initData) {
    var draft = {};
    function loadDraft(d) {
      draft = {};
      if (d && typeof d === "object") {
        Object.keys(d).forEach(function (k) {
          var v = d[k] || {};
          draft[k] = {
            input: Number(v.input || 0),
            output: Number(v.output || 0),
            cached: Number(v.cached || 0)
          };
        });
      }
    }
    loadDraft(initData);

    var box = document.createElement("div");
    box.className = "ptable";
 box.style.border = "1px solid #eee";
    box.style.borderRadius = "8px";
    box.style.padding = "8px";
    box.style.marginTop = "4px";

    function refresh() {
      box.innerHTML = "";
      var keys = Object.keys(draft).sort();
      if (!keys.length) {
        var empty = document.createElement("div");
        empty.style.color = "#999";
        empty.style.fontSize = "13px";
        empty.textContent = "（空，未配置价格的模型按 default 或 0 计费）";
        box.appendChild(empty);
      } else {
        var tbl = document.createElement("table");
        tbl.style.width = "100%";
        tbl.style.borderCollapse = "collapse";
        tbl.style.fontSize = "13px";
        var thead = document.createElement("thead");
        thead.innerHTML = '<tr><th style="text-align:left;padding:4px;">模型</th><th>输入</th><th>输出</th><th>缓存</th><th></th></tr>';
        tbl.appendChild(thead);
        var tbody = document.createElement("tbody");
        keys.forEach(function (k) {
          var tr = document.createElement("tr");
          var tdName = document.createElement("td");
          tdName.style.padding = "4px";
          tdName.textContent = k;
          tr.appendChild(tdName);
          ["input", "output", "cached"].forEach(function (f) {
            var td = document.createElement("td");
            var inp = document.createElement("input");
            inp.type = "number";
            inp.step = "0.01";
            inp.min = "0";
            inp.value = draft[k][f];
            inp.style.width = "70px";
            inp.addEventListener("change", function () {
              var v = Number(inp.value);
              if (isNaN(v) || v < 0) v = 0;
              draft[k][f] = v;
            });
            td.appendChild(inp);
            tr.appendChild(td);
          });
          var tdDel = document.createElement("td");
          var del = document.createElement("button");
          del.type = "button";
          del.textContent = "✕";
          del.style.cssText = "background:#fee;border:0;color:#c33;border-radius:4px;padding:2px 6px;cursor:pointer;";
          del.addEventListener("click", function () {
            delete draft[k];
            refresh();
          });
          tdDel.appendChild(del);
          tr.appendChild(tdDel);
          tbody.appendChild(tr);
        });
        tbl.appendChild(tbody);
        box.appendChild(tbl);
      }

      // 新增一行
      var add = document.createElement("div");
      add.style.cssText = "display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;";
      var nameInp = document.createElement("input");
      nameInp.type = "text";
      nameInp.placeholder = "模型名（如 gemini-3.6 或 default）";
      nameInp.style.cssText = "flex:1;min-width:180px;";
      var inInp = document.createElement("input");
      inInp.type = "number"; inInp.step = "0.01"; inInp.min = "0";
      inInp.placeholder = "输入"; inInp.style.width = "70px";
      var outInp = document.createElement("input");
      outInp.type = "number"; outInp.step = "0.01"; outInp.min = "0";
      outInp.placeholder = "输出"; outInp.style.width = "70px";
      var cacheInp = document.createElement("input");
      cacheInp.type = "number"; cacheInp.step = "0.01"; cacheInp.min = "0";
      cacheInp.placeholder = "缓存"; cacheInp.style.width = "70px";
      var addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.textContent = "➕ 添加";
      addBtn.style.cssText = "padding:4px 10px;border:0;border-radius:6px;background:#4a90e2;color:#fff;cursor:pointer;";
      addBtn.addEventListener("click", function () {
        var name = nameInp.value.trim();
        if (!name) { toast("请填写模型名"); return; }
        draft[name] = {
          input: Number(inInp.value) || 0,
          output: Number(outInp.value) || 0,
          cached: Number(cacheInp.value) || 0
        };
        nameInp.value = ""; inInp.value = ""; outInp.value = ""; cacheInp.value = "";
        refresh();
      });
      add.appendChild(nameInp);
      add.appendChild(inInp); add.appendChild(outInp); add.appendChild(cacheInp);
      add.appendChild(addBtn);
      box.appendChild(add);

      // 保存按钮
      var save = document.createElement("button");
      save.type = "button";
      save.textContent = "💾 保存价格表";
      save.style.cssText = "margin-top:8px;padding:6px 14px;border:0;border-radius:6px;background:#2ecc71;color:#fff;cursor:pointer;";
      save.addEventListener("click", function () {
        save.disabled = true; save.textContent = "保存中…";
        saveSetting("model_price_table", draft).then(function () {
          toast("价格表已保存");
          save.textContent = "💾 保存价格表"; save.disabled = false;
        }).catch(function () {
          save.textContent = "💾 保存价格表"; save.disabled = false;
        });
      });
      box.appendChild(save);
    }
    refresh();
    return box;
  }

  function renderMergeMapEditor(row, initData) {
    var draft = {};
    function loadDraft(d) {
      draft = {};
      if (d && typeof d === "object") {
        Object.keys(d).forEach(function (k) {
          var v = d[k];
          if (Array.isArray(v)) draft[k] = v.map(String);
        });
      }
    }
    loadDraft(initData);

    var box = document.createElement("div");
    box.className = "mmap";
    box.style.border = "1px solid #eee";
    box.style.borderRadius = "8px";
    box.style.padding = "8px";
    box.style.marginTop = "4px";

    function refresh() {
      box.innerHTML = "";
      var keys = Object.keys(draft).sort();
      if (!keys.length) {
        var empty = document.createElement("div");
        empty.style.color = "#999";
        empty.style.fontSize = "13px";
        empty.textContent = "（空。手动合并优先于自动最小交集合并）";
        box.appendChild(empty);
      } else {
        var tbl = document.createElement("table");
        tbl.style.width = "100%";
        tbl.style.borderCollapse = "collapse";
        tbl.style.fontSize = "13px";
        var thead = document.createElement("thead");
        thead.innerHTML = '<tr><th style="text-align:left;padding:4px;">规范名（交集）</th><th style="text-align:left;">实际成员（逗号分隔）</th><th></th></tr>';
        tbl.appendChild(thead);
        var tbody = document.createElement("tbody");
        keys.forEach(function (k) {
          var tr = document.createElement("tr");
          var tdName = document.createElement("td");
          tdName.style.padding = "4px";
          var nameInp = document.createElement("input");
          nameInp.type = "text";
          nameInp.value = k;
          nameInp.style.width = "100%";
          var oldName = k;
          nameInp.addEventListener("change", function () {
            var nn = nameInp.value.trim();
            if (!nn || nn === oldName) return;
            draft[nn] = draft[oldName];
            delete draft[oldName];
            oldName = nn;
          });
          tdName.appendChild(nameInp);
          tr.appendChild(tdName);
          var tdMem = document.createElement("td");
          tdMem.style.padding = "4px";
          var memInp = document.createElement("input");
          memInp.type = "text";
          memInp.value = (draft[k] || []).join(", ");
          memInp.style.width = "100%";
          memInp.addEventListener("change", function () {
            var parts = memInp.value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
            draft[oldName] = parts;
          });
          tdMem.appendChild(memInp);
          tr.appendChild(tdMem);
          var tdDel = document.createElement("td");
          var del = document.createElement("button");
          del.type = "button";
          del.textContent = "✕";
          del.style.cssText = "background:#fee;border:0;color:#c33;border-radius:4px;padding:2px 6px;cursor:pointer;";
          del.addEventListener("click", function () {
            delete draft[oldName];
            refresh();
          });
          tdDel.appendChild(del);
          tr.appendChild(tdDel);
          tbody.appendChild(tr);
        });
        tbl.appendChild(tbody);
        box.appendChild(tbl);
      }

      // 新增一行
      var add = document.createElement("div");
      add.style.cssText = "display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;";
      var nameInp = document.createElement("input");
      nameInp.type = "text";
      nameInp.placeholder = "规范名（如 gemini-3.6）";
      nameInp.style.cssText = "flex:1;min-width:160px;";
      var memInp = document.createElement("input");
      memInp.type = "text";
      memInp.placeholder = "成员（逗号分隔，如 1er-gemini-3.6, abc-gemini-3.6）";
      memInp.style.cssText = "flex:2;min-width:240px;";
      var addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.textContent = "➕ 添加";
      addBtn.style.cssText = "padding:4px 10px;border:0;border-radius:6px;background:#4a90e2;color:#fff;cursor:pointer;";
      addBtn.addEventListener("click", function () {
        var name = nameInp.value.trim();
        if (!name) { toast("请填写规范名"); return; }
        var parts = memInp.value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
        if (!parts.length) { toast("请至少填一个成员"); return; }
        draft[name] = parts;
        nameInp.value = ""; memInp.value = "";
        refresh();
      });
      add.appendChild(nameInp); add.appendChild(memInp); add.appendChild(addBtn);
      box.appendChild(add);

      // 保存按钮
      var save = document.createElement("button");
      save.type = "button";
      save.textContent = "💾 保存合并表";
      save.style.cssText = "margin-top:8px;padding:6px 14px;border:0;border-radius:6px;background:#2ecc71;color:#fff;cursor:pointer;";
      save.addEventListener("click", function () {
        save.disabled = true; save.textContent = "保存中…";
        saveSetting("model_merge_map", draft).then(function () {
          toast("合并表已保存");
          save.textContent = "💾 保存合并表"; save.disabled = false;
        }).catch(function () {
          save.textContent = "💾 保存合并表"; save.disabled = false;
        });
      });
      box.appendChild(save);
    }
    refresh();
    return box;
  }

  function loadSettings() {
    return api("/api/config").then(function (data) {
      settingsRows.innerHTML = "";
      SETTING_FIELDS.forEach(function (field) {
        if (!(field.key in data.values)) return;
        var row = document.createElement("div");
        row.className = "row";
        var label = document.createElement("label");
        label.textContent = field.label;
        row.appendChild(label);

        if (field.type === "bool") {
          var sw = document.createElement("button");
          sw.type = "button";
          sw.className = "switch";
          sw.setAttribute("role", "switch");
          sw.innerHTML = '<span class="knob"></span>';
          var on = !!data.values[field.key];
          sw.classList.toggle("on", on);
          sw.setAttribute("aria-checked", on ? "true" : "false");
          sw.addEventListener("click", function () {
            var next = !sw.classList.contains("on");
            sw.classList.toggle("on", next);
            sw.setAttribute("aria-checked", next ? "true" : "false");
            saveSetting(field.key, next);
          });
          row.appendChild(sw);
        } else if (field.type === "select") {
          var wrap = document.createElement("div");
          wrap.className = "select-wrap";
          var sel = document.createElement("select");
          (data.options[field.key] || []).forEach(function (opt) {
            var o = document.createElement("option"); o.value = opt.value; o.textContent = opt.label; sel.appendChild(o);
          });
          sel.value = String(data.values[field.key]);
          sel.addEventListener("change", function () { saveSetting(field.key, sel.value); });
          wrap.appendChild(sel);
          wrap.insertAdjacentHTML("beforeend", svgIcon("chev"));
          row.appendChild(wrap);
        } else if (field.type === "skills") {
          // Skill 管理：每个 skill 一个开关。on=启用，off=禁用。
          // 变动时把所有关掉的 skill 路径收集成 disabled_skills 列表 POST。
          var skills = data.options.skill_list || [];
          var disabled = data.values.disabled_skills || [];
          var disabledSet = {};
          disabled.forEach(function (p) { disabledSet[p] = true; });
          var skillBox = document.createElement("div");
          skillBox.className = "skill-list";
          skills.forEach(function (sk) {
            var item = document.createElement("div");
            item.className = "skill-item";
            var sw = document.createElement("button");
            sw.type = "button";
            sw.className = "switch";
            sw.setAttribute("role", "switch");
            sw.innerHTML = '<span class="knob"></span>';
            var on = !disabledSet[sk.path];
            sw.classList.toggle("on", on);
            sw.setAttribute("aria-checked", on ? "true" : "false");
            var name = document.createElement("span");
            name.className = "skill-name";
            var srcIcon = sk.source === "private" ? "🔒 " : "📦 ";
            name.textContent = srcIcon + sk.label;
            sw.addEventListener("click", function () {
              var next = !sw.classList.contains("on");
              sw.classList.toggle("on", next);
              sw.setAttribute("aria-checked", next ? "true" : "false");
              // 重算禁用列表：所有 switch 里关掉的
              var newDisabled = [];
              skillBox.querySelectorAll(".skill-item").forEach(function (it) {
                var s = it.querySelector(".switch");
                var p = it.dataset.path;
                if (!s.classList.contains("on")) newDisabled.push(p);
              });
              saveSetting("disabled_skills", newDisabled);
            });
            item.dataset.path = sk.path;
            item.appendChild(name);
            item.appendChild(sw);
            skillBox.appendChild(item);
          });
          if (!skills.length) {
            skillBox.textContent = "暂无 skill 文件";
          }
          row.appendChild(skillBox);
        } else if (field.type === "price_table") {
          row.appendChild(renderPriceTableEditor(row, data.values[field.key] || {}));
        } else if (field.type === "merge_map") {
          row.appendChild(renderMergeMapEditor(row, data.values[field.key] || {}));
        } else {
          var num = document.createElement("input");
          num.type = "number";
          if (field.min != null) num.min = field.min;
          if (field.max != null) num.max = field.max;
          num.value = data.values[field.key];
          num.addEventListener("change", function () { saveSetting(field.key, Number(num.value)); });
          row.appendChild(num);
        }
        settingsRows.appendChild(row);
      });
    });
  }

  // ---- 命令菜单侧栏 ----
  function buildMenu() {
    var list = document.getElementById("cmd-list");
    list.innerHTML = "";
    COMMANDS.forEach(function (c) {
      var item = document.createElement("div");
      item.className = "menu-item";
      item.innerHTML = '<span class="m-cmd">' + escapeHtml(c.cmd) + "</span><span class=\"m-desc\">" + escapeHtml(c.desc) + "</span>";
      item.addEventListener("click", function () {
        closeMenu();
        input.value = c.cmd + " ";
        input.focus();
        input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 168) + "px";
        syncSendState();
      });
      list.appendChild(item);
    });
  }
  function openMenu() { menuPanel.classList.add("open"); overlay.classList.remove("hidden"); }
  function closeMenu() { menuPanel.classList.remove("open"); overlay.classList.add("hidden"); }

  // ---- 启动 ----
  function boot() {
    loginDlg.close();
    buildMenu();
    // 先开流再拉历史：流里的帧会缓冲到 history 落地后再放行（见 applyFrame），
    // 所以这个顺序不会丢消息，反而能接住拉历史期间到达的帧。
    connectStream();
    resync();
  }
  function tryLogin(payload) { return api("/api/login", { method: "POST", body: JSON.stringify(payload) }); }

  api("/api/session").then(function (data) {
    if (data.authenticated) { boot(); return; }
    var initData = tg && tg.initData ? tg.initData : "";
    if (initData) {
      // 有 initData：Telegram WebApp 内打开，尝试免密登录
      return tryLogin({ init_data: initData }).then(boot).catch(function () {
        // 免密失败——可能是 bot_token 不匹配 / auth_date 过期 / user_id 不匹配
        loginErr.textContent = "Telegram 免密登录失败，请输入密码继续";
        loginDlg.showModal();
      });
    }
    // 无 initData：不是在 Telegram WebApp 内打开（普通浏览器 / Telegram 内置浏览器直接访问 URL）
    loginSub.textContent = "未检测到 Telegram 身份，请输入访问密码";
    loginDlg.showModal();
  }).catch(function () { loginDlg.showModal(); });

  // ---- 事件绑定 ----
  document.getElementById("btn-login").addEventListener("click", function () {
    loginErr.textContent = "";
    tryLogin({ password: document.getElementById("password").value })
      .then(boot).catch(function (err) { loginErr.textContent = err.message; });
  });
  document.getElementById("password").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("btn-login").click();
  });

  btnSend.addEventListener("click", send);
  input.addEventListener("keydown", function (e) {
    if (suggest.classList.contains("hidden")) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
      return;
    }
    // 补全菜单激活时：上下选择 / Tab 填入 / Enter 执行或发送 / Esc 关闭
    var items = suggest.querySelectorAll(".cmd-item");
    if (e.key === "ArrowDown") { e.preventDefault(); suggestIndex = Math.min(suggestIndex + 1, items.length - 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); suggestIndex = Math.max(suggestIndex - 1, 0); }
    else if (e.key === "Tab") {
      e.preventDefault();
      if (suggestIndex >= 0 && items[suggestIndex]) { items[suggestIndex].click(); return; }
    }
    else if (e.key === "Enter") {
      e.preventDefault();
      if (suggestIndex >= 0 && items[suggestIndex]) {
        var sel = suggestMatches[suggestIndex];
        // 输入已经完整等于选中命令（/status 打全了）：Enter 是"发送"，
        // 不是"再填一遍"——否则每条打全的命令都要按两次回车。
        if (sel && input.value.trim().toLowerCase() === sel.cmd.toLowerCase()) {
          hideSuggest(); send(); return;
        }
        items[suggestIndex].click(); return;
      }
      hideSuggest(); send(); return;
    } else if (e.key === "Escape") { hideSuggest(); return; }
    else { return; }
    markActive();
  });
  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 168) + "px";
    syncSendState();
    var val = input.value;
    var slash = val.lastIndexOf("/");
    if (slash === 0 && val.indexOf(" ") < 0) { showSuggest(val); }
    else { hideSuggest(); }
  });
  syncSendState();

  btnStop.addEventListener("click", function () { api("/api/stop", { method: "POST" }).catch(function () {}); });
  btnAttach.addEventListener("click", function () { fileInput.click(); });

  // 文件选择：加入待发送队列并回显徽标。选完不立即上传，等点发送时跟附言一起发。
  fileInput.addEventListener("change", function () {
    for (var i = 0; i < fileInput.files.length; i++) {
      pendingFiles.push(fileInput.files[i]);
    }
    fileInput.value = "";   // 清空，否则选同一个文件不触发 change
    renderPendingFiles();
  });

  function renderPendingFiles() {
    pendingFilesEl.innerHTML = "";
    pendingFiles.forEach(function (f, idx) {
      var chip = document.createElement("div");
      chip.className = "pending-file";
      var name = document.createElement("span");
      name.className = "pf-name";
      name.textContent = "📎 " + f.name;
      var del = document.createElement("button");
      del.className = "pf-del";
      del.type = "button";
      del.setAttribute("aria-label", "移除");
      del.textContent = "×";
      del.addEventListener("click", function () {
        pendingFiles.splice(idx, 1);
        renderPendingFiles();
      });
      chip.appendChild(name);
      chip.appendChild(del);
      pendingFilesEl.appendChild(chip);
    });
    pendingFilesEl.classList.toggle("hidden", pendingFiles.length === 0);
    syncSendState();
  }

  function clearPendingFiles() {
    pendingFiles = [];
    renderPendingFiles();
  }

  // 空状态快捷命令：点一下填进输入框（与命令菜单侧栏的行为一致——
  // 填入而不是直接执行，让用户有机会补参数）。
  var chips = document.querySelectorAll("#empty-state .chip");
  Array.prototype.forEach.call(chips, function (chip) {
    chip.addEventListener("click", function () {
      input.value = chip.dataset.cmd + " ";
      input.focus();
      syncSendState();
    });
  });

  // 滚动检测 & 滚动到底部按钮
  log.addEventListener("scroll", function () {
    if (isNearBottom()) hideScrollBtn(); else showScrollBtn();
  });
  scrollBtn.addEventListener("click", function () { scrollDown(); });

  document.getElementById("btn-menu").addEventListener("click", openMenu);
  document.getElementById("btn-close-menu").addEventListener("click", closeMenu);
  overlay.addEventListener("click", closeMenu);

  document.getElementById("btn-terminal").addEventListener("click", function () {
    // 在当前页面内嵌 iframe 打开终端，避免 Telegram webview 跳转外部浏览器，
    // 同时保留聊天页面状态。关闭即回到聊天。
    var modal = document.getElementById("terminal-modal");
    var iframe = document.getElementById("terminal-iframe");
    if (iframe.dataset.loaded !== "1") {
      iframe.src = "/terminal";
      iframe.dataset.loaded = "1";
    }
    modal.classList.add("open");
  });
  document.getElementById("btn-close-terminal").addEventListener("click", function () {
    document.getElementById("terminal-modal").classList.remove("open");
  });
  // iframe 内的 terminal.html 点"返回聊天"时，postMessage 通知关闭模态层
  window.addEventListener("message", function (event) {
    if (event.data && event.data.type === "xgent-close-terminal") {
      document.getElementById("terminal-modal").classList.remove("open");
    }
  });

  document.getElementById("btn-settings").addEventListener("click", function () {
    settings.classList.add("open");
    loadSettings().catch(function (err) { toast("读取配置失败：" + err.message); });
  });
  document.getElementById("btn-close-settings").addEventListener("click", function () { settings.classList.remove("open"); });
  document.getElementById("btn-logout").addEventListener("click", function () {
    api("/api/logout", { method: "POST" }).then(function () { location.reload(); });
  });

  // Esc 逐层关闭浮层
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (document.getElementById("terminal-modal").classList.contains("open")) {
      document.getElementById("terminal-modal").classList.remove("open");
    } else if (settings.classList.contains("open")) {
      settings.classList.remove("open");
    } else if (menuPanel.classList.contains("open")) {
      closeMenu();
    }
  });
})();
</script>
</body>
