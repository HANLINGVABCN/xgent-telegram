<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>XGent Web Chat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ============================================================
     XGent Web — 设计系统
     单一强调色 + 分层中性面，发丝级描边，无阴影噪点。
     ============================================================ */
  :root {
    color-scheme: light;

    /* 面 */
    --bg:        #F5F6F8;
    --surface:   #FFFFFF;
    --surface-2: #EFF1F4;
    --surface-3: #E5E8ED;
    --scrim:     rgba(14, 18, 27, .42);

    /* 描边 */
    --line:      rgba(14, 18, 27, .085);
    --line-2:    rgba(14, 18, 27, .16);

    /* 文字 */
    --text:      #101319;
    --text-2:    #59616F;
    --text-3:    #8C94A2;

    /* 强调 */
    --accent:      #4B53E0;
    --accent-2:    #7A4FE6;
    --accent-soft: rgba(75, 83, 224, .10);
    --accent-ring: rgba(75, 83, 224, .22);
    --grad:        linear-gradient(135deg, #565EEA 0%, #8A5AF0 100%);
    --glow:        rgba(75, 83, 224, .07);

    --danger:    #DC2B44;
    --ok:        #16A46B;
    --warn:      #E08A16;

    --code-bg:   #14161C;
    --code-fg:   #E4E7EE;
    --code-line: rgba(255, 255, 255, .09);

    /* 气泡 */
    --ai-bg:     #FFFFFF;
    --ai-line:   rgba(14, 18, 27, .09);
    --ai-shadow: 0 1px 2px rgba(14, 18, 27, .05), 0 1px 1px rgba(14, 18, 27, .03);

    --scroll:    rgba(14, 18, 27, .18);
    --scroll-h:  rgba(14, 18, 27, .30);

    /* 几何 */
    --r-xs: 7px;  --r-sm: 10px; --r-md: 13px;
    --r-lg: 17px; --r-xl: 22px; --r-full: 999px;
    --header-h: 58px;

    --ease: cubic-bezier(.2, .8, .2, 1);
    --t: .16s var(--ease);

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text",
            "Segoe UI", Inter, "PingFang SC", "HarmonyOS Sans SC", "MiSans",
            "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo,
            Consolas, "Liberation Mono", monospace;
  }

  body.dark {
    color-scheme: dark;

    --bg:        #08090C;
    --surface:   #101218;
    --surface-2: #171A21;
    --surface-3: #20242D;
    --scrim:     rgba(0, 0, 0, .62);

    --line:      rgba(255, 255, 255, .075);
    --line-2:    rgba(255, 255, 255, .15);

    --text:      #ECEEF3;
    --text-2:    #9BA3B2;
    --text-3:    #6A7383;

    --accent:      #8189FF;
    --accent-2:    #B08BFF;
    --accent-soft: rgba(129, 137, 255, .13);
    --accent-ring: rgba(129, 137, 255, .26);
    --grad:        linear-gradient(135deg, #5D67F5 0%, #9B62F0 100%);
    --glow:        rgba(129, 137, 255, .11);

    --danger:    #FF6B7E;
    --ok:        #3ECF8E;
    --warn:      #F0B429;

    --code-bg:   #0B0D12;
    --code-fg:   #DDE1E9;
    --code-line: rgba(255, 255, 255, .07);

    --ai-bg:     #131620;
    --ai-line:   rgba(255, 255, 255, .07);
    --ai-shadow: none;

    --scroll:    rgba(255, 255, 255, .14);
    --scroll-h:  rgba(255, 255, 255, .26);
  }

  /* ---- 基础 ---- */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.55;
    letter-spacing: -.006em;
    display: flex; flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    transition: background .28s var(--ease), color .28s var(--ease);
  }
  ::selection { background: var(--accent-ring); color: var(--text); }

  *::-webkit-scrollbar { width: 11px; height: 11px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: var(--scroll); border-radius: var(--r-full);
    border: 3.5px solid transparent; background-clip: content-box;
  }
  *::-webkit-scrollbar-thumb:hover { background: var(--scroll-h); background-clip: content-box; }
  #log, .cmd-list, .cmd-suggest, #settings { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }

  /* 描边属性写在 <svg> 上：stroke / fill 是可继承属性，能穿进 <use> 的影子树，
     而 `.icon path {…}` 这类后代选择器选不到影子树里的节点。 */
  .icon {
    width: 20px; height: 20px; display: block; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .hidden { display: none !important; }

  /* ---- 顶栏 ---- */
  #header {
    height: var(--header-h); flex-shrink: 0; z-index: 6;
    display: flex; align-items: center; gap: 6px;
    padding: 0 10px 0 8px; padding-top: env(safe-area-inset-top);
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    border-bottom: 1px solid var(--line);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
  }
  @supports not (background: color-mix(in srgb, red 50%, blue)) {
    #header { background: var(--surface); }
  }
  .icon-btn {
    width: 36px; height: 36px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--text-2);
    border-radius: var(--r-sm); cursor: pointer;
    transition: background var(--t), color var(--t), transform .1s var(--ease);
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }

  .header-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; margin-left: 2px; }
  .bot-avatar {
    width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0;
    background: var(--grad); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 650; font-size: 15px; letter-spacing: -.02em;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16), 0 2px 8px var(--accent-ring);
  }
  .header-text { min-width: 0; }
  .bot-name {
    font-weight: 620; font-size: 14.5px; line-height: 1.25;
    letter-spacing: -.012em; color: var(--text);
  }
  .bot-status {
    font-size: 12px; line-height: 1.3; color: var(--text-3);
    display: flex; align-items: center; gap: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bot-status.busy { color: var(--accent); }

  .conn-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent);
    transition: background var(--t);
  }
  .conn-dot.connecting { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); animation: pulse 1.4s var(--ease) infinite; }
  .conn-dot.disconnected { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 20%, transparent); }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ---- 消息区 ---- */
  #log {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    padding: 16px 14px 8px;
    background:
      radial-gradient(820px 340px at 50% -6%, var(--glow), transparent 72%),
      var(--bg);
  }
  .msg-row {
    display: flex; margin: 0 auto 10px; max-width: 980px;   /* 宽屏时会话居中成一栏 */
    animation: rise .24s var(--ease) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } }
  @media (prefers-reduced-motion: reduce) { .msg-row { animation: none; } }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.ai { justify-content: flex-start; }
  .msg-row.sys { justify-content: center; margin: 14px 0; }

  .bubble {
    position: relative; min-width: 0;
    word-wrap: break-word; overflow-wrap: anywhere;
    font-size: 15px; line-height: 1.6;
  }
  .bubble.ai {
    max-width: min(760px, 92%);
    background: var(--ai-bg); color: var(--text);
    border: 1px solid var(--ai-line); box-shadow: var(--ai-shadow);
    border-radius: var(--r-lg) var(--r-lg) var(--r-lg) var(--r-xs);
    padding: 11px 14px 10px;
  }
  .bubble.user {
    max-width: min(560px, 84%);
    background: var(--grad); color: #fff;
    border-radius: var(--r-lg) var(--r-lg) var(--r-xs) var(--r-lg);
    padding: 10px 14px 9px;
    box-shadow: 0 2px 10px var(--accent-ring);
  }
  .bubble .ts {
    float: right; margin: 6px 0 0 10px;
    font-size: 11px; line-height: 1; color: var(--text-3);
    font-variant-numeric: tabular-nums; user-select: none;
  }
  .bubble.user .ts { color: rgba(255, 255, 255, .68); }
  .bubble .body > :first-child { margin-top: 0; }
  .bubble .body > :last-child { margin-bottom: 0; }

  .bubble pre {
    background: var(--code-bg); color: var(--code-fg);
    border: 1px solid var(--code-line); border-radius: var(--r-md);
    padding: 12px 13px; margin: 9px 0; overflow-x: auto;
    font: 12.5px/1.65 var(--mono); letter-spacing: 0;
    position: relative; white-space: pre;
  }
  .bubble.user pre { background: rgba(0, 0, 0, .26); border-color: rgba(255, 255, 255, .14); color: #F0F2F7; }
  .bubble code {
    background: var(--surface-2); border: 1px solid var(--line);
    padding: .1em .38em; border-radius: var(--r-xs);
    font: 12.5px var(--mono); letter-spacing: 0;
  }
  .bubble.user code { background: rgba(0, 0, 0, .22); border-color: rgba(255, 255, 255, .16); }
  .bubble pre code { background: transparent; border: none; padding: 0; font-size: inherit; }
  .bubble a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-ring); }
  .bubble.user a { color: #fff; border-bottom-color: rgba(255, 255, 255, .45); }
  .bubble a:hover { border-bottom-color: currentColor; }
  .bubble blockquote {
    margin: 8px 0; padding: 2px 0 2px 12px;
    border-left: 2px solid var(--line-2); color: var(--text-2);
  }
  .bubble b, .bubble strong { font-weight: 640; }

  /* 代码块复制 */
  .copy-code-btn {
    position: absolute; top: 7px; right: 7px;
    display: flex; align-items: center; gap: 4px;
    background: rgba(255, 255, 255, .07); color: #C9CEDA;
    border: 1px solid rgba(255, 255, 255, .11); border-radius: var(--r-xs);
    padding: 4px 8px; font: 500 11px/1 var(--font); cursor: pointer;
    opacity: 0; transition: opacity var(--t), background var(--t), color var(--t);
    backdrop-filter: blur(8px);
  }
  .copy-code-btn .icon { width: 12px; height: 12px; stroke-width: 2; }
  .bubble pre:hover .copy-code-btn { opacity: 1; }
  .copy-code-btn:hover { background: rgba(255, 255, 255, .15); color: #fff; }
  .copy-code-btn.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  @media (hover: none) { .copy-code-btn { opacity: .85; } }

  /* 整条消息复制 */
  .msg-copy {
    position: absolute; top: 4px; right: -34px;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); background: var(--surface); color: var(--text-3);
    border-radius: var(--r-sm); cursor: pointer;
    opacity: 0; transform: translateX(-4px);
    transition: opacity var(--t), transform var(--t), color var(--t), background var(--t);
  }
  .msg-copy .icon { width: 14px; height: 14px; }
  .bubble.ai:hover .msg-copy { opacity: 1; transform: none; }
  .msg-copy:hover { color: var(--accent); background: var(--surface-2); }
  .msg-copy.done { color: var(--ok); opacity: 1; transform: none; }
  @media (max-width: 780px), (hover: none) { .msg-copy { display: none; } }

  .sys-pill {
    background: var(--surface); border: 1px solid var(--line);
    color: var(--text-2); padding: 6px 13px; border-radius: var(--r-full);
    font-size: 12.5px; line-height: 1.5; max-width: 86%;
    text-align: center; white-space: pre-wrap; word-wrap: break-word;
    box-shadow: var(--ai-shadow);
  }

  /* ---- 内联按钮 ---- */
  .inline-keyboard { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .ik-row { display: flex; gap: 6px; }
  .ik-btn {
    flex: 1; padding: 9px 8px;
    font: 500 13.5px/1.3 var(--font); letter-spacing: -.005em;
    background: var(--surface-2); color: var(--accent);
    border: 1px solid var(--line); border-radius: var(--r-sm);
    cursor: pointer; transition: background var(--t), border-color var(--t), transform .1s var(--ease);
  }
  .ik-btn:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent-ring); }
  .ik-btn:active:not(:disabled) { transform: scale(.985); }
  .ik-btn:disabled { opacity: .5; cursor: default; }
  .ik-btn.loading { background: var(--accent-soft); }
  .bubble.user .ik-btn {
    background: rgba(255, 255, 255, .14); color: #fff; border-color: rgba(255, 255, 255, .2);
  }

  /* ---- 输入中 ---- */
  /* 与 #log 里居中的 980px 会话栏左边缘对齐（#log 左右各 14px 内边距）。 */
  #typing {
    display: flex; align-items: center; gap: 5px; width: fit-content;
    padding: 11px 14px;
    margin: 0 0 10px max(14px, calc((100vw - 1008px) / 2 + 14px));
    background: var(--ai-bg); border: 1px solid var(--ai-line); box-shadow: var(--ai-shadow);
    border-radius: var(--r-lg) var(--r-lg) var(--r-lg) var(--r-xs);
  }
  #typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-3);
    animation: blink 1.3s var(--ease) infinite;
  }
  #typing span:nth-child(2) { animation-delay: .16s; }
  #typing span:nth-child(3) { animation-delay: .32s; }
  @keyframes blink {
    0%, 70%, 100% { opacity: .28; transform: translateY(0); }
    35% { opacity: 1; transform: translateY(-3.5px); }
  }

  /* ---- 空状态 ---- */
  #empty-state {
    position: fixed; left: 0; right: 0; top: var(--header-h); bottom: 96px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 24px; text-align: center; pointer-events: none; z-index: 1;
  }
  #empty-state .mark {
    width: 60px; height: 60px; border-radius: 19px; margin-bottom: 16px;
    background: var(--grad); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 34px var(--accent-ring), inset 0 0 0 1px rgba(255, 255, 255, .18);
  }
  #empty-state .mark .icon { width: 28px; height: 28px; }
  #empty-state .title { font-size: 17px; font-weight: 620; letter-spacing: -.018em; color: var(--text); }
  #empty-state .desc { font-size: 13.5px; color: var(--text-3); max-width: 280px; line-height: 1.6; }

  /* ---- 输入栏 ---- */
  footer {
    flex-shrink: 0; z-index: 5;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px 14px; padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  #composer {
    position: relative; max-width: 980px; margin: 0 auto;
  }
  .composer-row {
    position: relative;
    display: flex; align-items: flex-end; gap: 4px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--r-xl); padding: 4px 4px 4px 5px;
    transition: border-color var(--t), box-shadow var(--t), background var(--t);
  }
  .composer-row:focus-within {
    border-color: var(--accent-ring); background: var(--surface);
    box-shadow: 0 0 0 3.5px var(--accent-ring);
  }
  #pending-files {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 6px 8px; margin-bottom: 6px;
    display: flex; flex-direction: column; gap: 4px;
  }
  #pending-files.hidden { display: none; }
  .pending-file {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-2);
    background: var(--surface-3); border-radius: var(--r-md);
    padding: 4px 6px 4px 8px;
  }
  .pending-file .pf-name {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pending-file .pf-del {
    flex-shrink: 0; width: 20px; height: 20px; border: none; background: transparent;
    color: var(--text-3); cursor: pointer; border-radius: var(--r-full);
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .pending-file .pf-del:hover { background: var(--surface); color: var(--text); }
  .input-wrap { flex: 1; min-width: 0; position: static; }
  #btn-attach { width: 36px; height: 36px; border-radius: var(--r-full); color: var(--text-3); }
  #btn-attach:hover { background: var(--surface-3); color: var(--text-2); }
  textarea {
    display: block; width: 100%; resize: none;
    min-height: 36px; max-height: 168px; padding: 8px 4px;
    background: transparent; color: var(--text);
    border: none; outline: none;
    font-family: var(--font); font-size: 15px; line-height: 1.4;
    letter-spacing: -.006em;
  }
  textarea::placeholder { color: var(--text-3); }
  .send-btn, .stop-btn {
    width: 36px; height: 36px; flex-shrink: 0;
    border: none; border-radius: var(--r-full); cursor: pointer; color: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--t), opacity var(--t), transform .1s var(--ease);
  }
  .send-btn { background: var(--surface-3); color: var(--text-3); }
  .send-btn.ready { background: var(--grad); color: #fff; box-shadow: 0 2px 10px var(--accent-ring); }
  .send-btn:active:not(:disabled) { transform: scale(.9); }
  .send-btn:disabled { cursor: default; }
  .stop-btn { background: var(--danger); }
  .stop-btn .icon { width: 16px; height: 16px; }
  .stop-btn:active { transform: scale(.9); }

  /* ---- /命令补全 ---- */
  .cmd-suggest {
    position: absolute; bottom: calc(100% + 9px); left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-md); overflow: hidden auto; max-height: 264px; z-index: 8;
    box-shadow: 0 12px 36px rgba(8, 10, 16, .16), 0 2px 6px rgba(8, 10, 16, .08);
    animation: rise .16s var(--ease);
  }
  .cmd-item {
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 13px; cursor: pointer;
    border-bottom: 1px solid var(--line);
    transition: background var(--t);
  }
  .cmd-item:last-child { border-bottom: none; }
  .cmd-item:hover, .cmd-item.active { background: var(--accent-soft); }
  .cmd-item .c-cmd {
    font: 600 13px var(--mono); color: var(--accent);
    white-space: nowrap; letter-spacing: 0;
  }
  .cmd-item .c-desc {
    color: var(--text-3); font-size: 12.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---- 滚动到底部 ---- */
  #scroll-bottom {
    position: fixed; right: 18px; bottom: 84px; z-index: 4;
    width: 38px; height: 38px; border-radius: var(--r-full);
    border: 1px solid var(--line); background: var(--surface); color: var(--text-2);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 4px 16px rgba(8, 10, 16, .14);
    opacity: 0; pointer-events: none; transform: translateY(8px) scale(.9);
    transition: opacity var(--t), transform var(--t), color var(--t);
  }
  #scroll-bottom.show { opacity: 1; pointer-events: auto; transform: none; }
  #scroll-bottom:hover { color: var(--accent); }

  /* ---- 侧滑命令菜单 ---- */
  .side-panel {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(330px, 86vw); z-index: 22;
    background: var(--surface); border-right: 1px solid var(--line);
    transform: translateX(-101%); transition: transform .26s var(--ease);
    display: flex; flex-direction: column;
  }
  .side-panel.open { transform: none; box-shadow: 24px 0 60px rgba(8, 10, 16, .22); }
  #overlay {
    position: fixed; inset: 0; z-index: 20; background: var(--scrim);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    animation: fade .2s var(--ease);
  }
  @keyframes fade { from { opacity: 0; } }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px 0 18px; height: var(--header-h); flex-shrink: 0;
    padding-top: env(safe-area-inset-top);
    border-bottom: 1px solid var(--line);
    font-size: 15px; font-weight: 620; letter-spacing: -.012em;
  }
  .cmd-list { flex: 1; overflow-y: auto; padding: 8px 8px 24px; }
  .cmd-list .group-label {
    font-size: 11px; font-weight: 620; letter-spacing: .07em; text-transform: uppercase;
    color: var(--text-3); padding: 14px 10px 7px;
  }
  .menu-item {
    display: flex; flex-direction: column; gap: 1px;
    padding: 9px 11px; border-radius: var(--r-sm); cursor: pointer;
    transition: background var(--t);
  }
  .menu-item:hover { background: var(--surface-2); }
  .menu-item .m-cmd { font: 600 13px var(--mono); color: var(--accent); letter-spacing: 0; }
  .menu-item .m-desc { color: var(--text-3); font-size: 12px; }

  /* ---- 设置面板 ---- */
  #settings {
    position: fixed; inset: 0; z-index: 26; overflow-y: auto;
    background: var(--bg); display: none;
  }
  #settings.open { display: block; animation: slideUp .24s var(--ease); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } }
  .settings-head {
    display: flex; align-items: center; gap: 8px; height: var(--header-h);
    padding: 0 12px 0 6px; padding-top: env(safe-area-inset-top);
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 2;
  }
  @supports not (background: color-mix(in srgb, red 50%, blue)) {
    .settings-head { background: var(--surface); }
  }
  .settings-head strong { flex: 1; font-size: 15px; font-weight: 620; letter-spacing: -.012em; }
  .settings-body { max-width: 620px; margin: 0 auto; padding: 20px 16px 48px; }
  .section-label {
    font-size: 11px; font-weight: 620; letter-spacing: .07em; text-transform: uppercase;
    color: var(--text-3); margin: 0 0 8px 4px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-md); overflow: hidden;
  }
  .row {
    display: flex; align-items: center; gap: 14px; justify-content: space-between;
    padding: 13px 15px; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row label { font-size: 14px; color: var(--text); min-width: 0; }
  .select-wrap { position: relative; flex-shrink: 0; display: flex; align-items: center; }
  .select-wrap .icon {
    position: absolute; right: 9px; width: 15px; height: 15px;
    color: var(--text-3); pointer-events: none;
  }
  .row select, .row input[type=number] {
    appearance: none; -webkit-appearance: none;
    background: var(--surface-2); color: var(--text);
    font-family: var(--font); font-size: 13.5px; font-weight: 500;
    border: 1px solid var(--line); border-radius: var(--r-xs);
    padding: 7px 10px; min-width: 150px; max-width: 190px;
    cursor: pointer; transition: border-color var(--t), box-shadow var(--t);
  }
  .row select { padding-right: 28px; text-overflow: ellipsis; }
  .row input[type=number] { text-align: right; font-variant-numeric: tabular-nums; min-width: 96px; cursor: text; }
  .row select:focus, .row input:focus { outline: none; border-color: var(--accent-ring); box-shadow: 0 0 0 3px var(--accent-ring); }

  .switch {
    position: relative; flex-shrink: 0;
    width: 44px; height: 26px; padding: 0; border: none; cursor: pointer;
    border-radius: var(--r-full); background: var(--surface-3);
    transition: background .22s var(--ease);
  }
  .switch .knob {
    position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(8, 10, 16, .3);
    transition: transform .22s var(--ease);
  }
  .switch.on { background: var(--accent); }
  .switch.on .knob { transform: translateX(18px); }
  .switch:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }
  .skill-list { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .skill-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 10px; background: var(--surface-3); border-radius: var(--r-md); }
  .skill-name { font-size: 13.5px; color: var(--text-2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .hint { color: var(--text-3); font-size: 12.5px; line-height: 1.65; margin: 12px 4px 0; }
  .btn-text {
    background: transparent; border: none; color: var(--accent);
    font-family: var(--font); font-size: 14px; font-weight: 500;
    cursor: pointer; padding: 8px 10px; border-radius: var(--r-xs);
    transition: background var(--t);
  }
  .btn-text:hover { background: var(--accent-soft); }
  .btn-danger-row {
    margin-top: 22px; width: 100%; padding: 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    color: var(--danger); font: 500 14px var(--font); cursor: pointer;
    transition: background var(--t), border-color var(--t);
  }
  .btn-danger-row:hover { background: color-mix(in srgb, var(--danger) 8%, var(--surface)); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }

  /* ---- 终端模态层 ---- */
  #terminal-modal {
    position: fixed; inset: 0; z-index: 30; background: var(--bg);
    display: none; flex-direction: column;
  }
  #terminal-modal.open { display: flex; animation: fade .2s var(--ease); }
  #terminal-modal .term-head {
    display: flex; align-items: center; gap: 8px; height: var(--header-h); flex-shrink: 0;
    padding: 0 10px 0 6px; padding-top: env(safe-area-inset-top);
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  #terminal-modal .term-head strong { flex: 1; font-size: 15px; font-weight: 620; letter-spacing: -.012em; }
  #terminal-iframe { flex: 1; width: 100%; border: none; background: var(--bg); }

  /* ---- 登录 ---- */
  dialog {
    border: none; padding: 0; overflow: hidden;
    width: 372px; max-width: 92vw;
    background: var(--surface); color: var(--text);
    border-radius: var(--r-xl);
    box-shadow: 0 28px 70px rgba(8, 10, 16, .32), 0 0 0 1px var(--line);
  }
  dialog::backdrop { background: var(--scrim); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  dialog[open] { animation: dlg .28s var(--ease); }
  @keyframes dlg { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  .login-card { padding: 32px 26px 26px; }
  .login-icon {
    width: 54px; height: 54px; border-radius: 17px; margin: 0 auto 18px;
    background: var(--grad); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 650; letter-spacing: -.02em;
    box-shadow: 0 8px 26px var(--accent-ring), inset 0 0 0 1px rgba(255, 255, 255, .18);
  }
  dialog h2 { margin: 0 0 6px; font-size: 19px; font-weight: 640; letter-spacing: -.022em; text-align: center; }
  .login-sub { color: var(--text-3); font-size: 13.5px; text-align: center; margin: 0 0 22px; line-height: 1.55; }
  dialog input {
    width: 100%; padding: 12px 14px; margin-bottom: 12px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r-sm);
    font-family: var(--font); font-size: 15px;
    transition: border-color var(--t), box-shadow var(--t), background var(--t);
  }
  dialog input::placeholder { color: var(--text-3); }
  dialog input:focus { outline: none; background: var(--surface); border-color: var(--accent-ring); box-shadow: 0 0 0 3.5px var(--accent-ring); }
  .err { color: var(--danger); font-size: 13px; min-height: 19px; margin-bottom: 6px; line-height: 1.45; }
  .btn-primary {
    width: 100%; padding: 12px 14px; border: none; border-radius: var(--r-sm);
    background: var(--grad); color: #fff;
    font-family: var(--font); font-size: 15px; font-weight: 560; cursor: pointer;
    box-shadow: 0 4px 16px var(--accent-ring);
    transition: transform .1s var(--ease), opacity var(--t);
  }
  .btn-primary:hover { opacity: .93; }
  .btn-primary:active { transform: scale(.985); }
  .login-foot {
    padding: 14px 26px; background: var(--surface-2); border-top: 1px solid var(--line);
    text-align: center; font-size: 12px; color: var(--text-3); line-height: 1.55;
  }

  /* ---- toast ---- */
  #toast {
    position: fixed; left: 50%; bottom: 96px; z-index: 60;
    transform: translate(-50%, 10px); max-width: 88vw;
    background: color-mix(in srgb, var(--text) 92%, transparent); color: var(--bg);
    padding: 10px 17px; border-radius: var(--r-full);
    font-size: 13px; font-weight: 500; letter-spacing: -.004em;
    box-shadow: 0 8px 28px rgba(8, 10, 16, .28);
    opacity: 0; pointer-events: none;
    transition: opacity .2s var(--ease), transform .2s var(--ease);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @supports not (background: color-mix(in srgb, red 50%, blue)) {
    #toast { background: #14161C; color: #fff; }
  }
</style>
</head>

<script>
(function () {

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

  var btnTheme = document.getElementById("btn-theme");

  var byMessageId = {};   // message_id -> { row, body, btns }
  var evtSource = null;
  var suggestIndex = -1;

  var reconnectDelay = 1000;
  var msgCount = 0;
  var pendingFiles = [];  // 待上传文件 File[]，选完先回显，跟文本一起发送

  function svgIcon(name, cls) {
    return '<svg class="icon' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24"><use href="#i-' + name + '"/></svg>';
  }

  // ---- 主题 ----
  // 优先级：用户手动选择 > Telegram 主题 > 系统偏好。
  function applyTheme(dark) {
    document.body.classList.toggle("dark", dark);
    btnTheme.innerHTML = svgIcon(dark ? "sun" : "moon");
  }
  var savedTheme = localStorage.getItem("xgent-theme");
  if (savedTheme === "dark" || savedTheme === "light") {
    applyTheme(savedTheme === "dark");
  } else if (tg && tg.colorScheme) {
    applyTheme(tg.colorScheme === "dark");
  } else {
    applyTheme(!!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches));
  }
  btnTheme.addEventListener("click", function () {
    var isDark = !document.body.classList.contains("dark");
    applyTheme(isDark);
    localStorage.setItem("xgent-theme", isDark ? "dark" : "light");
  });

  // 与 Telegram 注册的命令一致（lifecycle.py setup_bot_commands）。
  var COMMANDS = [
    {cmd:"/start", desc:"打开主菜单"},
    {cmd:"/config", desc:"打开设置面板"},
    {cmd:"/status", desc:"查看状态"},
    {cmd:"/show_chat_info", desc:"状态与记忆统计"},
    {cmd:"/clear_memory", desc:"清空上下文"},
    {cmd:"/agent", desc:"开关 Agent 模式"},
    {cmd:"/stream", desc:"开关流式输出"},
    {cmd:"/thinking", desc:"设置思考深度"},
    {cmd:"/depth", desc:"设置记忆深度"},
    {cmd:"/timeout", desc:"设置超时"},
    {cmd:"/models", desc:"选择默认模型"},
    {cmd:"/chat_model", desc:"选择对话模型"},
    {cmd:"/media_model", desc:"选择媒体模型"},
    {cmd:"/providers", desc:"管理提供商"},
    {cmd:"/provider_config", desc:"导入导出配置"},
    {cmd:"/prompts", desc:"管理提示词"},
    {cmd:"/web", desc:"配置网页版"},
    {cmd:"/blacklist", desc:"命令黑名单"},
    {cmd:"/export", desc:"导出记忆"},
    {cmd:"/update", desc:"更新代码"},
    {cmd:"/restart", desc:"重启 Bot"}
  ];

  // ---- 工具 ----
  function api(path, options) {
    options = options || {};
    options.credentials = "same-origin";
    options.headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
    return fetch(path, options).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (body) {
        if (!r.ok) { throw new Error(body.error || ("HTTP " + r.status)); }
        return body;
      });
    });
  }

  // 复制到剪贴板。
  // navigator.clipboard 只在安全上下文（https / localhost）可用，本服务常以
  // http://ip:port 直连，因此必须回退到 execCommand('copy')，否则「复制」全线失效。
  function copyText(text) {
    text = String(text == null ? "" : text);
    return new Promise(function (resolve, reject) {
      function legacy() {
        try {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;";
          document.body.appendChild(ta);
          var sel = document.getSelection();
          var prev = sel && sel.rangeCount ? sel.getRangeAt(0) : null;
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, ta.value.length);   // iOS 需要显式 range
          var ok = document.execCommand("copy");
          document.body.removeChild(ta);
          if (prev && sel) { sel.removeAllRanges(); sel.addRange(prev); }
          ok ? resolve() : reject(new Error("execCommand copy failed"));
        } catch (e) { reject(e); }
      }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(resolve, legacy);
      } else {
        legacy();
      }
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // 安全渲染 bot 的 HTML：只放行白名单标签，剥离其余标签与危险属性。
  var ALLOWED = { B:1, STRONG:1, I:1, EM:1, U:1, INS:1, S:1, STRIKE:1, DEL:1, CODE:1, PRE:1, BR:1, A:1, BLOCKQUOTE:1 };
  function sanitizeHtml(html) {
    var tmp = document.createElement("div");
    tmp.innerHTML = String(html);
    (function clean(node) {
      Array.prototype.slice.call(node.childNodes).forEach(function (c) {
        if (c.nodeType === 3) return;                 // 文本节点保留
        if (c.nodeType !== 1) { node.removeChild(c); return; }
        if (!ALLOWED[c.tagName]) {
          var frag = document.createDocumentFragment();
          while (c.firstChild) frag.appendChild(c.firstChild);
          c.parentNode.replaceChild(frag, c);
          return;
        }
        Array.prototype.slice.call(c.attributes).forEach(function (a) {
          if (c.tagName === "A" && a.name === "href") {
            if (!/^(https?:|mailto:)/i.test(a.value)) c.removeAttribute(a.name);
          } else if (c.tagName === "A" && (a.name === "target" || a.name === "rel")) {
            /* 保留，下面统一设置 */
          } else {
            c.removeAttribute(a.name);
          }
        });
        if (c.tagName === "A") { c.target = "_blank"; c.rel = "noopener noreferrer"; }
        clean(c);
      });
    })(tmp);
    return tmp.innerHTML;
  }

  function renderText(text, parseMode) {
    text = text == null ? "" : String(text);
    if (parseMode && String(parseMode).toUpperCase().indexOf("HTML") >= 0) {
      return sanitizeHtml(text);
    }
    // 纯文本：转义后还原代码块与换行。
    var out = escapeHtml(text);
    out = out.replace(/```([a-zA-Z0-9_+#.-]*)\n?([\s\S]*?)```/g, function (_, lang, code) {
      // 吃掉 ```python 这类语言标记，否则它会当成代码第一行显示出来。
      return "<pre>" + code.replace(/^\n+/, "").replace(/\n+$/, "") + "</pre>";
    });
    out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    out = out.replace(/\n/g, "<br>");
    // 代码块自带上下外边距，紧贴它的 <br> 会叠出一大片空白。
    out = out.replace(/(?:<br>\s*)+<pre>/g, "<pre>").replace(/<\/pre>(?:\s*<br>)+/g, "</pre>");
    return out;
  }

  function nowTime() {
    var d = new Date();
    return (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();
  }

  function toast(msg, alert) {
    if (!msg) return;
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove("show"); }, alert ? 2600 : 1800);
  }

  function scrollDown() { log.scrollTop = log.scrollHeight; hideScrollBtn(); }

  function isNearBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 80; }
  function hideScrollBtn() { scrollBtn.classList.remove("show"); }
  function showScrollBtn() { scrollBtn.classList.add("show"); }

  function updateEmptyState() {
    emptyState.classList.toggle("hidden", msgCount !== 0);
  }

  // 复制按钮的通用「已复制」反馈
  function flashCopied(btn, label) {
    var old = btn.innerHTML;
    btn.innerHTML = svgIcon("check") + (label ? "<span>已复制</span>" : "");
    btn.classList.add("done");
    clearTimeout(btn._t);
    btn._t = setTimeout(function () { btn.innerHTML = old; btn.classList.remove("done"); }, 1400);
  }

  // 给 pre 块注入复制按钮
  function injectCopyButtons(container) {
    var pres = container.querySelectorAll("pre");
    Array.prototype.forEach.call(pres, function (pre) {
      if (pre.querySelector(".copy-code-btn")) return;
      var btn = document.createElement("button");
      btn.className = "copy-code-btn";
      btn.type = "button";
      btn.innerHTML = svgIcon("copy") + "<span>复制</span>";
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        // 按钮本身在 <pre> 内，直接取 textContent 会把「复制」二字也复制进去。
        var code = pre.querySelector("code");
        var text;
        if (code) {
          text = code.textContent;
        } else {
          var clone = pre.cloneNode(true);
          var stray = clone.querySelector(".copy-code-btn");
          if (stray && stray.parentNode) stray.parentNode.removeChild(stray);
          text = clone.textContent;
        }
        copyText(text).then(function () { flashCopied(btn, true); })
                      .catch(function () { toast("复制失败，请手动选中"); });
      });
      pre.appendChild(btn);
    });
  }

  // ---- 气泡渲染 ----
  function makeBubble(role, text, messageId, parseMode, markup) {
    msgCount++;
    updateEmptyState();
    var row = document.createElement("div");
    row.className = "msg-row " + role;
    if (role === "sys") {
      var pill = document.createElement("div");
      pill.className = "sys-pill";
      pill.innerHTML = renderText(text, parseMode);
      row.appendChild(pill);
      log.appendChild(row);
      scrollDown();
      return { row: row, body: pill, btns: null };
    }
    var bubble = document.createElement("div");
    bubble.className = "bubble " + role;
    var body = document.createElement("div");
    body.className = "body";
    body.innerHTML = renderText(text, parseMode);
    injectCopyButtons(body);
    var ts = document.createElement("span");
    ts.className = "ts";
    ts.textContent = nowTime();
    bubble.appendChild(body);
    bubble.appendChild(ts);
    if (role === "ai") {
      var mc = document.createElement("button");
      mc.className = "msg-copy";
      mc.type = "button";
      mc.title = "复制整条消息";
      mc.innerHTML = svgIcon("copy");
      mc.addEventListener("click", function () {
        // 临时藏掉代码块的「复制」按钮，避免它的文字被一起复制走。
        var strays = body.querySelectorAll(".copy-code-btn");
        Array.prototype.forEach.call(strays, function (b) { b.style.display = "none"; });
        var text = body.innerText;
        Array.prototype.forEach.call(strays, function (b) { b.style.display = ""; });
        copyText(text).then(function () { flashCopied(mc, false); })
                      .catch(function () { toast("复制失败，请手动选中"); });
      });
      bubble.appendChild(mc);
    }
    var btns = null;
    if (markup && markup.length) { btns = renderButtons(markup, messageId); if (btns) bubble.appendChild(btns); }
    row.appendChild(bubble);
    log.appendChild(row);
    scrollDown();
    var entry = { row: row, body: body, btns: btns };
    if (messageId != null) { byMessageId[messageId] = entry; }
    return entry;
  }

  function renderButtons(rows, messageId) {
    var container = document.createElement("div");
    container.className = "inline-keyboard";
    rows.forEach(function (row) {
      var rowEl = document.createElement("div");
      rowEl.className = "ik-row";
      row.forEach(function (btn) {
        if (!btn.callback_data) return;   // url/web_app 按钮在网页无意义，跳过
        var b = document.createElement("button");
        b.className = "ik-btn";
        b.textContent = btn.text;
        b.addEventListener("click", function () {
          if (b.disabled) return;
          b.disabled = true; b.classList.add("loading");
          api("/api/callback", { method: "POST", body: JSON.stringify({ callback_data: btn.callback_data, message_id: messageId }) })
            .catch(function (err) { toast(err.message); })
            .finally(function () { setTimeout(function () { b.disabled = false; b.classList.remove("loading"); }, 350); });
        });
        rowEl.appendChild(b);
      });
      if (rowEl.childNodes.length) container.appendChild(rowEl);
    });
    return container.childNodes.length ? container : null;
  }

  function setButtons(entry, markup, messageId) {
    if (entry.btns && entry.btns.parentNode) entry.btns.parentNode.removeChild(entry.btns);
    entry.btns = null;
    if (markup && markup.length) {
      entry.btns = renderButtons(markup, messageId);
      if (entry.btns) entry.row.querySelector(".bubble").appendChild(entry.btns);
    }
  }

  // ---- 状态 ----
  function setBusy(busy) {
    btnSend.disabled = busy;
    btnSend.classList.toggle("hidden", busy);
    btnStop.classList.toggle("hidden", !busy);
    if (busy) {
      statusText.innerHTML = '<span class="conn-dot"></span> 正在输入…';
    } else {
      setConnState(currentConnState);
    }
    statusText.classList.toggle("busy", busy);
    if (busy) showTyping(); else hideTyping();
  }
  function showTyping() { typing.classList.remove("hidden"); scrollDown(); }
  function hideTyping() { typing.classList.add("hidden"); }

  // ---- SSE 帧处理 ----
  function handleFrame(frame) {
    if (frame.type === "message") {
      makeBubble("ai", frame.text, frame.message_id, frame.parse_mode, frame.reply_markup);
      hideTyping();
    } else if (frame.type === "edit") {
      var e = byMessageId[frame.message_id];
      if (e) {
        e.body.innerHTML = renderText(frame.text, frame.parse_mode);
        injectCopyButtons(e.body);
        if (frame.reply_markup !== undefined) setButtons(e, frame.reply_markup, frame.message_id);
      } else {
        makeBubble("ai", frame.text, frame.message_id, frame.parse_mode, frame.reply_markup);
      }
      scrollDown();
    } else if (frame.type === "edit_markup") {
      var em = byMessageId[frame.message_id];
      if (em) setButtons(em, frame.reply_markup, frame.message_id);
    } else if (frame.type === "delete") {
      var d = byMessageId[frame.message_id];
      if (d && d.row && d.row.parentNode) d.row.parentNode.removeChild(d.row);
      delete byMessageId[frame.message_id];
      msgCount = Math.max(0, msgCount - 1);
      updateEmptyState();
    } else if (frame.type === "user_message") {
      // Telegram 侧发来的用户消息，镜像到网页
      makeBubble("user", frame.text, null, null, null);
      hideTyping();
    } else if (frame.type === "document" || frame.type === "photo") {
      makeBubble("sys", (frame.type === "document" ? "📎 " : "🖼️ ") +
        (frame.filename || (frame.type === "photo" ? "图片" : "文件")) +
        (frame.caption ? "\n" + frame.caption : ""), frame.message_id, null, null);
    } else if (frame.type === "chat_action") {
      if (frame.action === "typing") showTyping(); else hideTyping();
    } else if (frame.type === "callback_answer") {
      toast(frame.text, frame.show_alert);
    } else if (frame.type === "turn_end") {
      setBusy(false);
    } else if (frame.type === "turn_error") {
      makeBubble("sys", "⚠️ " + (frame.text || "处理失败"));
      setBusy(false);
    }
  }

  var currentConnState = "";

  // ---- 帧与历史的对齐 ----
  // history 是真相源。SSE 帧必须等 history 落地后再应用：loadHistory() 会
  // log.innerHTML="" 并清空 byMessageId，夹在中间到的消息会被直接抹掉，
  // 而它后续的 edit 帧找不到气泡又会新建一条 —— 于是重复、错乱。
  var historyReady = false;
  var pendingFrames = [];
  var everOpened = false;

  function applyFrame(frame) {
    if (!historyReady) {
      if (pendingFrames.length < 500) pendingFrames.push(frame);   // 兜底，防无限堆积
      return;
    }
    handleFrame(frame);
  }

  function flushPending() {
    historyReady = true;
    var queued = pendingFrames;
    pendingFrames = [];
    queued.forEach(function (f) { try { handleFrame(f); } catch (e) {} });
  }

  // 重新对齐服务端状态。断线期间漏掉的帧补不回来，只能重拉一次历史 ——
  // 这正是以前必须手动刷新才恢复的那一步，现在重连时自动做。
  function resync() {
    historyReady = false;
    return loadHistory().then(flushPending, flushPending);
  }

  function setConnState(state) {
    currentConnState = state || "";
    var cls = "conn-dot" + (state ? " " + state : "");
    if (state === "connecting") statusText.innerHTML = '<span class="' + cls + '"></span> 连接中…';
    else if (state === "disconnected") statusText.innerHTML = '<span class="' + cls + '"></span> 已断开，重连中…';
    else statusText.innerHTML = '<span class="' + cls + '"></span> 在线';
  }

  function connectStream() {
    if (evtSource) evtSource.close();
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    setConnState("connecting");
    evtSource = new EventSource("/api/stream");
    evtSource.onopen = function () {
      setConnState();
      reconnectDelay = 1000;
      // 首次连接由 boot() 负责拉历史；这里只处理重连——断线期间的帧已经错过，
      // 必须重新对齐一次，否则页面会一直停在错误状态直到手动刷新。
      if (everOpened) resync();
      everOpened = true;
    };
    evtSource.onmessage = function (e) {
      try { applyFrame(JSON.parse(e.data)); } catch (err) {}
    };
    evtSource.onerror = function () {
      setBusy(false);
      setConnState("disconnected");
      evtSource.close();
      // 指数退避重连，上限 30 秒
      reconnectTimer = setTimeout(function () {
        reconnectDelay = Math.min(reconnectDelay * 1.5, 30000);
        connectStream();
      }, reconnectDelay);
    };
  }

  function loadHistory() {
    return api("/api/history?limit=50").then(function (data) {
      log.innerHTML = "";
      byMessageId = {};
      msgCount = 0;
      (data.messages || []).forEach(function (m) {
        var role = m.role === "user" ? "user" : (m.role === "assistant" ? "ai" : "sys");
        makeBubble(role, m.content, null, m.parse_mode);
      });
      updateEmptyState();
      scrollDown();
    });
  }

  // ---- 发送 ----
  function syncSendState() {
    btnSend.classList.toggle("ready", input.value.trim().length > 0 || pendingFiles.length > 0);
  }

  function send() {
    var text = input.value.trim();
    var hasFiles = pendingFiles.length > 0;
    // 没文本又没文件，或正在忙，直接拦下。纯文件（无附言）允许发送。
    if ((!text && !hasFiles) || btnSend.disabled) return;

    // 本地先显示用户气泡：有文件时把文件名列进去，方便用户看到自己发了什么。
    var preview = text;
    if (hasFiles) {
      var names = pendingFiles.map(function (f) { return "📎 " + f.name; }).join("\n");
      preview = text ? (names + "\n" + text) : names;
    }
    makeBubble("user", preview);
    input.value = "";
    input.style.height = "auto";
    syncSendState();
    hideSuggest();
    setBusy(true);

    // 有文件走 multipart 上传：绕开 api() 强制的 JSON 头，让浏览器自带 boundary。
    // 文件与附言一起发；多个文件逐个上传（后端 /api/upload 单次单文件）。
    if (hasFiles) {
      sendFiles(text);
      return;
    }

    var isCmd = text.charAt(0) === "/";
    var path = isCmd ? "/api/command" : "/api/chat";
    var body = isCmd ? { command: text } : { text: text };
    api(path, { method: "POST", body: JSON.stringify(body) }).catch(function (err) {
      makeBubble("sys", "⚠️ " + err.message);
      setBusy(false);
    });
  }

  // 逐个上传待发送文件。附言只跟在第一个文件一起发，其余文件附言为空，
  // 避免同一段文本被重复喂给模型。全部完成才认为这一轮发起成功。
  function sendFiles(text) {
    var files = pendingFiles.slice();
    clearPendingFiles();
    var i = 0;
    function next() {
      if (i >= files.length) return;
      var f = files[i];
      var caption = (i === 0 ? text : "");
      i += 1;
      var fd = new FormData();
      fd.append("file", f, f.name);
      fd.append("text", caption);
      fetch("/api/upload", {
        method: "POST", credentials: "same-origin", body: fd,
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) {
          if (!r.ok) { throw new Error(body.error || ("HTTP " + r.status)); }
          return body;
        });
      }).then(function () {
        if (i < files.length) { next(); }
      }).catch(function (err) {
        makeBubble("sys", "⚠️ " + f.name + " 上传失败：" + err.message);
        setBusy(false);
      });
    }
    next();
  }

  // ---- / 命令补全 ----
  function showSuggest(q) {
    var prefix = q.toLowerCase();
    var matches = COMMANDS.filter(function (c) { return c.cmd.toLowerCase().indexOf(prefix) === 0; });
    if (!matches.length) { hideSuggest(); return; }
    suggest.innerHTML = "";
    matches.slice(0, 6).forEach(function (c, i) {
      var item = document.createElement("div");
      item.className = "cmd-item";
      item.innerHTML = '<span class="c-cmd">' + escapeHtml(c.cmd) + "</span><span class=\"c-desc\">" + escapeHtml(c.desc) + "</span>";
      item.addEventListener("click", function () {
        input.value = c.cmd + " ";
        input.focus();
        hideSuggest();
        input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 168) + "px";
        syncSendState();
      });
      item.dataset.idx = i;
      suggest.appendChild(item);
    });
    suggestIndex = -1;
    suggest.classList.remove("hidden");
  }
  function hideSuggest() { suggest.classList.add("hidden"); suggestIndex = -1; }

  // ---- 设置 ----
  var SETTING_FIELDS = [
    { key: "thinking_level", label: "思考深度", type: "select" },
    { key: "stream_mode", label: "流式输出", type: "bool" },
    { key: "agent_mode", label: "Agent 模式", type: "bool" },
    { key: "text_stitch_mode", label: "文字拼接", type: "select" },
    { key: "global_depth", label: "记忆深度", type: "number", min: 1, max: 500 },
    { key: "agent_max_iterations", label: "Agent 最大轮数", type: "number", min: 1, max: 50 },
    { key: "stream_timeout", label: "回复超时(秒, 0=不限)", type: "number", min: 0, max: 3600 },
    { key: "chat_model", label: "对话模型", type: "select" },
    { key: "disabled_skills", label: "Skill 管理", type: "skills" }
  ];
  function saveSetting(key, value) {
    return api("/api/config", { method: "POST", body: JSON.stringify({ key: key, value: value }) })
      .catch(function (err) { toast("保存失败：" + err.message); loadSettings(); });
  }
  function loadSettings() {
    return api("/api/config").then(function (data) {
      settingsRows.innerHTML = "";
      SETTING_FIELDS.forEach(function (field) {
        if (!(field.key in data.values)) return;
        var row = document.createElement("div");
        row.className = "row";
        var label = document.createElement("label");
        label.textContent = field.label;
        row.appendChild(label);

        if (field.type === "bool") {
          var sw = document.createElement("button");
          sw.type = "button";
          sw.className = "switch";
          sw.setAttribute("role", "switch");
          sw.innerHTML = '<span class="knob"></span>';
          var on = !!data.values[field.key];
          sw.classList.toggle("on", on);
          sw.setAttribute("aria-checked", on ? "true" : "false");
          sw.addEventListener("click", function () {
            var next = !sw.classList.contains("on");
            sw.classList.toggle("on", next);
            sw.setAttribute("aria-checked", next ? "true" : "false");
            saveSetting(field.key, next);
          });
          row.appendChild(sw);
        } else if (field.type === "select") {
          var wrap = document.createElement("div");
          wrap.className = "select-wrap";
          var sel = document.createElement("select");
          (data.options[field.key] || []).forEach(function (opt) {
            var o = document.createElement("option"); o.value = opt.value; o.textContent = opt.label; sel.appendChild(o);
          });
          sel.value = String(data.values[field.key]);
          sel.addEventListener("change", function () { saveSetting(field.key, sel.value); });
          wrap.appendChild(sel);
          wrap.insertAdjacentHTML("beforeend", svgIcon("chev"));
          row.appendChild(wrap);
        } else if (field.type === "skills") {
          // Skill 管理：每个 skill 一个开关。on=启用，off=禁用。
          // 变动时把所有关掉的 skill 路径收集成 disabled_skills 列表 POST。
          var skills = data.options.skill_list || [];
          var disabled = data.values.disabled_skills || [];
          var disabledSet = {};
          disabled.forEach(function (p) { disabledSet[p] = true; });
          var skillBox = document.createElement("div");
          skillBox.className = "skill-list";
          skills.forEach(function (sk) {
            var item = document.createElement("div");
            item.className = "skill-item";
            var sw = document.createElement("button");
            sw.type = "button";
            sw.className = "switch";
            sw.setAttribute("role", "switch");
            sw.innerHTML = '<span class="knob"></span>';
            var on = !disabledSet[sk.path];
            sw.classList.toggle("on", on);
            sw.setAttribute("aria-checked", on ? "true" : "false");
            var name = document.createElement("span");
            name.className = "skill-name";
            name.textContent = sk.label;
            sw.addEventListener("click", function () {
              var next = !sw.classList.contains("on");
              sw.classList.toggle("on", next);
              sw.setAttribute("aria-checked", next ? "true" : "false");
              // 重算禁用列表：所有 switch 里关掉的
              var newDisabled = [];
              skillBox.querySelectorAll(".skill-item").forEach(function (it) {
                var s = it.querySelector(".switch");
                var p = it.dataset.path;
                if (!s.classList.contains("on")) newDisabled.push(p);
              });
              saveSetting("disabled_skills", newDisabled);
            });
            item.dataset.path = sk.path;
            item.appendChild(name);
            item.appendChild(sw);
            skillBox.appendChild(item);
          });
          if (!skills.length) {
            skillBox.textContent = "暂无 skill 文件";
          }
          row.appendChild(skillBox);
        } else {
          num.type = "number";
          if (field.min != null) num.min = field.min;
          if (field.max != null) num.max = field.max;
          num.value = data.values[field.key];
          num.addEventListener("change", function () { saveSetting(field.key, Number(num.value)); });
          row.appendChild(num);
        }
        settingsRows.appendChild(row);
      });
    });
  }

  // ---- 命令菜单侧栏 ----
  function buildMenu() {
    var list = document.getElementById("cmd-list");
    list.innerHTML = "";
    COMMANDS.forEach(function (c) {
      var item = document.createElement("div");
      item.className = "menu-item";
      item.innerHTML = '<span class="m-cmd">' + escapeHtml(c.cmd) + "</span><span class=\"m-desc\">" + escapeHtml(c.desc) + "</span>";
      item.addEventListener("click", function () {
        closeMenu();
        input.value = c.cmd + " ";
        input.focus();
        input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 168) + "px";
        syncSendState();
      });
      list.appendChild(item);
    });
  }
  function openMenu() { menuPanel.classList.add("open"); overlay.classList.remove("hidden"); }
  function closeMenu() { menuPanel.classList.remove("open"); overlay.classList.add("hidden"); }

  // ---- 启动 ----
  function boot() {
    loginDlg.close();
    buildMenu();
    // 先开流再拉历史：流里的帧会缓冲到 history 落地后再放行（见 applyFrame），
    // 所以这个顺序不会丢消息，反而能接住拉历史期间到达的帧。
    connectStream();
    resync();
  }
  function tryLogin(payload) { return api("/api/login", { method: "POST", body: JSON.stringify(payload) }); }

  api("/api/session").then(function (data) {
    if (data.authenticated) { boot(); return; }
    var initData = tg && tg.initData ? tg.initData : "";
    if (initData) {
      // 有 initData：Telegram WebApp 内打开，尝试免密登录
      return tryLogin({ init_data: initData }).then(boot).catch(function () {
        // 免密失败——可能是 bot_token 不匹配 / auth_date 过期 / user_id 不匹配
        loginErr.textContent = "Telegram 免密登录失败，请输入密码继续";
        loginDlg.showModal();
      });
    }
    // 无 initData：不是在 Telegram WebApp 内打开（普通浏览器 / Telegram 内置浏览器直接访问 URL）
    loginSub.textContent = "未检测到 Telegram 身份，请输入访问密码";
    loginDlg.showModal();
  }).catch(function () { loginDlg.showModal(); });

  // ---- 事件绑定 ----
  document.getElementById("btn-login").addEventListener("click", function () {
    loginErr.textContent = "";
    tryLogin({ password: document.getElementById("password").value })
      .then(boot).catch(function (err) { loginErr.textContent = err.message; });
  });
  document.getElementById("password").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("btn-login").click();
  });

  btnSend.addEventListener("click", send);
  input.addEventListener("keydown", function (e) {
    if (suggest.classList.contains("hidden")) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
      return;
    }
    // 补全菜单激活时：上下选择 / Enter 确认 / Esc 关闭
    var items = suggest.querySelectorAll(".cmd-item");
    if (e.key === "ArrowDown") { e.preventDefault(); suggestIndex = Math.min(suggestIndex + 1, items.length - 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); suggestIndex = Math.max(suggestIndex - 1, 0); }
    else if (e.key === "Enter") {
      e.preventDefault();
      if (suggestIndex >= 0 && items[suggestIndex]) { items[suggestIndex].click(); return; }
      hideSuggest(); send(); return;
    } else if (e.key === "Escape") { hideSuggest(); return; }
    else { return; }
    Array.prototype.forEach.call(items, function (it, i) { it.classList.toggle("active", i === suggestIndex); });
  });
  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 168) + "px";
    syncSendState();
    var val = input.value;
    var slash = val.lastIndexOf("/");
    if (slash === 0 && val.indexOf(" ") < 0) { showSuggest(val); }
    else { hideSuggest(); }
  });
  syncSendState();

  btnStop.addEventListener("click", function () { api("/api/stop", { method: "POST" }).catch(function () {}); });
  btnAttach.addEventListener("click", function () { fileInput.click(); });

  // 文件选择：加入待发送队列并回显徽标。选完不立即上传，等点发送时跟附言一起发。
  fileInput.addEventListener("change", function () {
    for (var i = 0; i < fileInput.files.length; i++) {
      pendingFiles.push(fileInput.files[i]);
    }
    fileInput.value = "";   // 清空，否则选同一个文件不触发 change
    renderPendingFiles();
  });

  function renderPendingFiles() {
    pendingFilesEl.innerHTML = "";
    pendingFiles.forEach(function (f, idx) {
      var chip = document.createElement("div");
      chip.className = "pending-file";
      var name = document.createElement("span");
      name.className = "pf-name";
      name.textContent = "📎 " + f.name;
      var del = document.createElement("button");
      del.className = "pf-del";
      del.type = "button";
      del.setAttribute("aria-label", "移除");
      del.textContent = "×";
      del.addEventListener("click", function () {
        pendingFiles.splice(idx, 1);
        renderPendingFiles();
      });
      chip.appendChild(name);
      chip.appendChild(del);
      pendingFilesEl.appendChild(chip);
    });
    pendingFilesEl.classList.toggle("hidden", pendingFiles.length === 0);
    syncSendState();
  }

  function clearPendingFiles() {
    pendingFiles = [];
    renderPendingFiles();
  }

  // 滚动检测 & 滚动到底部按钮
  log.addEventListener("scroll", function () {
    if (isNearBottom()) hideScrollBtn(); else showScrollBtn();
  });
  scrollBtn.addEventListener("click", function () { scrollDown(); });

  document.getElementById("btn-menu").addEventListener("click", openMenu);
  document.getElementById("btn-close-menu").addEventListener("click", closeMenu);
  overlay.addEventListener("click", closeMenu);

  document.getElementById("btn-terminal").addEventListener("click", function () {
    // 在当前页面内嵌 iframe 打开终端，避免 Telegram webview 跳转外部浏览器，
    // 同时保留聊天页面状态。关闭即回到聊天。
    var modal = document.getElementById("terminal-modal");
    var iframe = document.getElementById("terminal-iframe");
    if (iframe.dataset.loaded !== "1") {
      iframe.src = "/terminal";
      iframe.dataset.loaded = "1";
    }
    modal.classList.add("open");
  });
  document.getElementById("btn-close-terminal").addEventListener("click", function () {
    document.getElementById("terminal-modal").classList.remove("open");
  });
  // iframe 内的 terminal.html 点"返回聊天"时，postMessage 通知关闭模态层
  window.addEventListener("message", function (event) {
    if (event.data && event.data.type === "xgent-close-terminal") {
      document.getElementById("terminal-modal").classList.remove("open");
    }
  });

  document.getElementById("btn-settings").addEventListener("click", function () {
    settings.classList.add("open");
    loadSettings().catch(function (err) { toast("读取配置失败：" + err.message); });
  });
  document.getElementById("btn-close-settings").addEventListener("click", function () { settings.classList.remove("open"); });
  document.getElementById("btn-logout").addEventListener("click", function () {
    api("/api/logout", { method: "POST" }).then(function () { location.reload(); });
  });

  // Esc 逐层关闭浮层
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (document.getElementById("terminal-modal").classList.contains("open")) {
      document.getElementById("terminal-modal").classList.remove("open");
    } else if (settings.classList.contains("open")) {
      settings.classList.remove("open");
    } else if (menuPanel.classList.contains("open")) {
      closeMenu();
    }
  });
})();
</script>
</body>
</html>
