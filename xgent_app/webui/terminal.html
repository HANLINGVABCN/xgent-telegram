<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XGent Terminal</title>
<script src="/vendor/telegram-web-app.js"></script>
<link rel="stylesheet" href="/vendor/xterm.min.css">
<script src="/vendor/xterm.min.js"></script>
<script src="/vendor/addon-fit.min.js"></script>
<link rel="stylesheet" href="/assets/terminal.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-back"><path d="M19.2 12H4.8M10.8 18 4.8 12l6-6"/></g>
    <g id="i-terminal"><rect x="2.7" y="4.2" width="18.6" height="15.6" rx="4"/><path d="m7.2 10 2.6 2.6-2.6 2.6M13.2 15.2h3.8"/></g>
    <g id="i-copy"><rect x="9.2" y="9.2" width="11.3" height="11.3" rx="2.8"/><path d="M5.6 14.8H5a2.5 2.5 0 0 1-2.5-2.5V5a2.5 2.5 0 0 1 2.5-2.5h7.3A2.5 2.5 0 0 1 14.8 5v.6"/></g>
    <g id="i-paste"><rect x="4.8" y="4.2" width="14.4" height="16.6" rx="3.4"/><path d="M9.2 4.2a2 2 0 0 1 2-2h1.6a2 2 0 0 1 2 2v1.2H9.2V4.2Z"/><path d="M9 12h6M9 15.6h4"/></g>
    <g id="i-check"><path d="m5 12.6 4.6 4.6L19 6.6"/></g>
    <g id="i-power"><path d="M12 3.4v8.2"/><path d="M17.6 6.6a7.4 7.4 0 1 1-11.2 0"/></g>
    <g id="i-lock"><rect x="4.4" y="10.2" width="15.2" height="10.4" rx="3.2"/><path d="M8 10.2V7.6a4 4 0 0 1 8 0v2.6"/></g>
    <g id="i-plug"><path d="M12 3.6v6.8M8.4 10.4h7.2v3.2a3.6 3.6 0 0 1-3.6 3.6 3.6 3.6 0 0 1-3.6-3.6v-3.2ZM12 17.2v3.2"/></g>
  </defs>
</svg>

<div id="bar">
  <button class="icon-btn" id="backBtn" title="返回聊天" aria-label="返回聊天"><svg class="icon" viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
  <div class="brand">
    <div class="dot-mark"><svg class="icon" viewBox="0 0 24 24"><use href="#i-terminal"/></svg></div>
    <span class="title">XGent 终端</span>
  </div>
  <button class="icon-btn" id="fontMinusBtn" title="缩小字号" aria-label="缩小字号">A-</button>
  <button class="icon-btn" id="fontPlusBtn" title="放大字号" aria-label="放大字号">A+</button>
  <button class="icon-btn" id="copyBtn" title="复制终端内容" aria-label="复制"><svg class="icon" viewBox="0 0 24 24"><use href="#i-copy"/></svg></button>
  <button class="icon-btn" id="pasteBtn" title="粘贴到终端" aria-label="粘贴"><svg class="icon" viewBox="0 0 24 24"><use href="#i-paste"/></svg></button>
  <button class="icon-btn danger" id="closeBtn" title="关闭会话" aria-label="关闭会话"><svg class="icon" viewBox="0 0 24 24"><use href="#i-power"/></svg></button>
</div>

<div id="keybar">
  <button class="vkey" data-key="\x1b">ESC</button>
  <button class="vkey" data-key="\t">TAB</button>
  <button class="vkey" data-key="\x03">Ctrl+C</button>
  <button class="vkey" data-key="\x04">Ctrl+D</button>
  <button class="vkey" data-key="\x1a">Ctrl+Z</button>
  <button class="vkey" data-key="\x1b[A">↑</button>
  <button class="vkey" data-key="\x1b[B">↓</button>
  <button class="vkey" data-key="\x1b[D">←</button>
  <button class="vkey" data-key="\x1b[C">→</button>
  <button class="vkey" data-key="|">|</button>
  <button class="vkey" data-key="~">~</button>
  <button class="vkey" data-key="/">/</button>
  <button class="vkey" data-key="clear\r">clear</button>
</div>

<div id="sessionBar"><select id="sessionSelect" aria-label="终端会话"></select><button id="newSessionBtn">＋ 新终端</button><button id="refreshSessionsBtn">刷新会话</button><span id="sessionNote">切换页面不会结束命令</span></div>
<div id="sessionTabs" role="tablist" aria-label="终端标签页"></div>
<div id="term-wrap"><div id="term"></div></div>
<div id="status"></div>
<div id="toast"></div>

<div class="overlay" id="loginOverlay">
  <div class="card">
    <div class="mark"><svg class="icon" viewBox="0 0 24 24"><use href="#i-lock"/></svg></div>
    <h2>终端登录验证</h2>
    <p class="sub">终端拥有系统级执行权限，仅授权用户可用。</p>
    <div id="err"></div>
    <input id="pw" type="password" placeholder="访问密码" autocomplete="current-password">
    <button class="btn-primary" id="loginBtn">登录终端</button>
    <div class="muted">在 Telegram 菜单中打开时可自动免密。</div>
  </div>
</div>

<div class="overlay" id="endedOverlay" style="display:none">
  <div class="card">
    <div class="mark"><svg class="icon" viewBox="0 0 24 24"><use href="#i-plug"/></svg></div>
    <h2>会话已结束</h2>
    <p class="sub" id="endReason"></p>
    <button class="btn-primary" id="renewBtn">新建终端会话</button>
    <div id="existingSessions"></div><button class="btn-ghost" id="endedBackBtn">返回聊天界面</button>
  </div>
</div>

<div class="overlay" id="pasteOverlay" style="display:none">
  <div class="card">
    <h2>粘贴到终端</h2>
    <p class="sub">当前环境不允许直接读取剪贴板，请在下方粘贴内容。</p>
    <textarea id="pasteBox" placeholder="在此长按粘贴，或按 Ctrl/⌘ + V"></textarea>
    <button class="btn-primary" id="pasteSendBtn">发送至终端</button>
    <button class="btn-ghost" id="pasteCancelBtn">取消</button>
  </div>
</div>

<script type="module" src="/assets/terminal.js"></script>
</body>
</html>
