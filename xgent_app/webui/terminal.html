<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>XGent Terminal</title>
<script src="/vendor/telegram-web-app.js"></script>
<link rel="stylesheet" href="/vendor/xterm.min.css">
<script src="/vendor/xterm.min.js"></script>
<script src="/vendor/addon-fit.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg:        #08090C;
    --surface:   #101218;
    --surface-2: #171A21;
    --surface-3: #20242D;
    --line:      rgba(255, 255, 255, .075);
    --line-2:    rgba(255, 255, 255, .15);
    --text:      #ECEEF3;
    --text-2:    #9BA3B2;
    --text-3:    #6A7383;
    --accent:      #8189FF;
    --accent-soft: rgba(129, 137, 255, .13);
    --accent-ring: rgba(129, 137, 255, .26);
    --grad:        linear-gradient(135deg, #5D67F5 0%, #9B62F0 100%);
    --danger:    #FF6B7E;
    --ok:        #3ECF8E;
    --warn:      #F0B429;
    --r-xs: 7px;  --r-sm: 10px; --r-md: 13px; --r-lg: 17px; --r-xl: 22px; --r-full: 999px;
    --header-h: 52px;
    --keybar-h: 40px;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --t: .16s var(--ease);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-ring); }

  .icon {
    width: 18px; height: 18px; display: block; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }

  /* ---- 顶栏 ---- */
  #bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 4;
    height: calc(var(--header-h) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 10px 0 8px;
    display: flex; align-items: center; gap: 5px;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  #bar .brand {
    display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; margin-left: 2px;
  }
  #bar .dot-mark {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    background: var(--grad); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2);
  }
  #bar .dot-mark .icon { width: 15px; height: 15px; }
  #bar .title {
    font-size: 14px; font-weight: 650; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .icon-btn {
    width: 32px; height: 32px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--text-2);
    border-radius: var(--r-xs); cursor: pointer;
    transition: background var(--t), color var(--t), transform .1s var(--ease);
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn.danger:hover { background: rgba(255, 107, 126, .14); color: var(--danger); }
  .icon-btn.done { color: var(--ok); }

  /* ---- 虚拟按键快捷栏 ---- */
  #keybar {
    position: absolute; left: 0; right: 0; z-index: 3;
    top: calc(var(--header-h) + env(safe-area-inset-top));
    height: var(--keybar-h);
    background: var(--surface-2); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 4px; padding: 0 8px;
    overflow-x: auto; scrollbar-width: none;
  }
  #keybar::-webkit-scrollbar { display: none; }
  .vkey {
    padding: 4px 8px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--text); font: 600 11.5px var(--mono); cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
    transition: background var(--t), color var(--t), transform 0.08s;
  }
  .vkey:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-ring); }
  .vkey:active { transform: scale(0.92); }

  /* ---- 终端视窗 ---- */
  #term-wrap {
    position: absolute; left: 0; right: 0; bottom: 0;
    top: calc(var(--header-h) + var(--keybar-h) + env(safe-area-inset-top));
    padding: 8px 6px 6px 8px;
    background: var(--bg);
  }
  #term { width: 100%; height: 100%; }
  .xterm .xterm-viewport { background: transparent !important; }
  .xterm-viewport::-webkit-scrollbar { width: 8px; }
  .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
  .xterm-viewport::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, .15); border-radius: var(--r-full);
    border: 2px solid transparent; background-clip: content-box;
  }

  /* ---- 状态指示浮条 ---- */
  #status {
    position: absolute; bottom: 10px; right: 14px; z-index: 5;
    display: flex; align-items: center; gap: 7px;
    padding: 4px 10px; border-radius: var(--r-full);
    background: rgba(16, 18, 24, .85); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    font-size: 11px; font-weight: 500; color: var(--text-3);
    font-variant-numeric: tabular-nums; pointer-events: none;
  }
  #status.flash { color: var(--ok); }
  #status .sep { color: var(--line-2); }
  .conn-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: var(--ok); box-shadow: 0 0 0 3px rgba(62, 207, 142, .2);
  }
  .conn-dot.disconnected { background: var(--danger); box-shadow: 0 0 0 3px rgba(255, 107, 126, .2); }
  .conn-dot.connecting { background: var(--warn); box-shadow: 0 0 0 3px rgba(240, 180, 41, .2); animation: pulse 1.3s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* ---- 模态浮层 ---- */
  .overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(4, 5, 8, .75);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .card {
    width: min(380px, 100%); padding: 30px 26px 26px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-xl); box-shadow: 0 28px 70px rgba(0, 0, 0, .6);
  }
  .card .mark {
    width: 52px; height: 52px; border-radius: 16px; margin: 0 auto 16px;
    background: var(--grad); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 26px var(--accent-ring);
  }
  .card .mark .icon { width: 25px; height: 25px; }
  .card h2 { margin: 0 0 6px; font-size: 18px; font-weight: 700; text-align: center; }
  .card .sub { margin: 0 0 18px; font-size: 13.5px; line-height: 1.55; color: var(--text-3); text-align: center; }
  .card input, .card textarea {
    width: 100%; padding: 12px 14px; margin-bottom: 12px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r-sm);
    font-family: var(--font); font-size: 14.5px; resize: none;
  }
  .card textarea { font-family: var(--mono); font-size: 13px; min-height: 100px; }
  .card input:focus, .card textarea:focus {
    outline: none; background: var(--bg); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring);
  }
  .btn-primary {
    width: 100%; padding: 12px 14px; border: none; border-radius: var(--r-sm);
    background: var(--grad); color: #fff;
    font-family: var(--font); font-size: 14.5px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 16px var(--accent-ring);
  }
  .btn-ghost {
    width: 100%; margin-top: 8px; padding: 10px 14px;
    background: transparent; color: var(--text-2);
    border: 1px solid var(--line); border-radius: var(--r-sm);
    font-family: var(--font); font-size: 13.5px; font-weight: 550; cursor: pointer;
  }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
  .muted { color: var(--text-3); font-size: 12.5px; margin-top: 14px; text-align: center; }
  #err { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 6px; }

  #toast {
    position: absolute; left: 50%; bottom: 50px; z-index: 20;
    transform: translate(-50%, 10px); max-width: 88vw;
    background: rgba(236, 238, 243, .95); color: #0B0D12;
    padding: 8px 16px; border-radius: var(--r-full);
    font-size: 13px; font-weight: 550; box-shadow: 0 8px 28px rgba(0, 0, 0, .4);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-back"><path d="M19.2 12H4.8M10.8 18 4.8 12l6-6"/></g>
    <g id="i-terminal"><rect x="2.7" y="4.2" width="18.6" height="15.6" rx="4"/><path d="m7.2 10 2.6 2.6-2.6 2.6M13.2 15.2h3.8"/></g>
    <g id="i-copy"><rect x="9.2" y="9.2" width="11.3" height="11.3" rx="2.8"/><path d="M5.6 14.8H5a2.5 2.5 0 0 1-2.5-2.5V5a2.5 2.5 0 0 1 2.5-2.5h7.3A2.5 2.5 0 0 1 14.8 5v.6"/></g>
    <g id="i-paste"><rect x="4.8" y="4.2" width="14.4" height="16.6" rx="3.4"/><path d="M9.2 4.2a2 2 0 0 1 2-2h1.6a2 2 0 0 1 2 2v1.2H9.2V4.2Z"/><path d="M9 12h6M9 15.6h4"/></g>
    <g id="i-check"><path d="m5 12.6 4.6 4.6L19 6.6"/></g>
    <g id="i-power"><path d="M12 3.4v8.2"/><path d="M17.6 6.6a7.4 7.4 0 1 1-11.2 0"/></g>
    <g id="i-lock"><rect x="4.4" y="10.2" width="15.2" height="10.4" rx="3.2"/><path d="M8 10.2V7.6a4 4 0 0 1 8 0v2.6"/></g>
    <g id="i-plug"><path d="M12 3.6v6.8M8.4 10.4h7.2v3.2a3.6 3.6 0 0 1-3.6 3.6 3.6 3.6 0 0 1-3.6-3.6v-3.2ZM12 17.2v3.2"/></g>
  </defs>
</svg>

<div id="bar">
  <button class="icon-btn" id="backBtn" title="返回聊天" aria-label="返回聊天"><svg class="icon" viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
  <div class="brand">
    <div class="dot-mark"><svg class="icon" viewBox="0 0 24 24"><use href="#i-terminal"/></svg></div>
    <span class="title">XGent 终端</span>
  </div>
  <button class="icon-btn" id="fontMinusBtn" title="缩小字号" aria-label="缩小字号">A-</button>
  <button class="icon-btn" id="fontPlusBtn" title="放大字号" aria-label="放大字号">A+</button>
  <button class="icon-btn" id="copyBtn" title="复制终端内容" aria-label="复制"><svg class="icon" viewBox="0 0 24 24"><use href="#i-copy"/></svg></button>
  <button class="icon-btn" id="pasteBtn" title="粘贴到终端" aria-label="粘贴"><svg class="icon" viewBox="0 0 24 24"><use href="#i-paste"/></svg></button>
  <button class="icon-btn danger" id="closeBtn" title="关闭会话" aria-label="关闭会话"><svg class="icon" viewBox="0 0 24 24"><use href="#i-power"/></svg></button>
</div>

<div id="keybar">
  <button class="vkey" data-key="\x1b">ESC</button>
  <button class="vkey" data-key="\t">TAB</button>
  <button class="vkey" data-key="\x03">Ctrl+C</button>
  <button class="vkey" data-key="\x04">Ctrl+D</button>
  <button class="vkey" data-key="\x1a">Ctrl+Z</button>
  <button class="vkey" data-key="\x1b[A">↑</button>
  <button class="vkey" data-key="\x1b[B">↓</button>
  <button class="vkey" data-key="\x1b[D">←</button>
  <button class="vkey" data-key="\x1b[C">→</button>
  <button class="vkey" data-key="|">|</button>
  <button class="vkey" data-key="~">~</button>
  <button class="vkey" data-key="/">/</button>
  <button class="vkey" data-key="clear\r">clear</button>
</div>

<div id="term-wrap"><div id="term"></div></div>
<div id="status"></div>
<div id="toast"></div>

<div class="overlay" id="loginOverlay">
  <div class="card">
    <div class="mark"><svg class="icon" viewBox="0 0 24 24"><use href="#i-lock"/></svg></div>
    <h2>终端登录验证</h2>
    <p class="sub">终端拥有系统级执行权限，仅授权用户可用。</p>
    <div id="err"></div>
    <input id="pw" type="password" placeholder="访问密码" autocomplete="current-password">
    <button class="btn-primary" id="loginBtn">登录终端</button>
    <div class="muted">在 Telegram 菜单中打开时可自动免密。</div>
  </div>
</div>

<div class="overlay" id="endedOverlay" style="display:none">
  <div class="card">
    <div class="mark"><svg class="icon" viewBox="0 0 24 24"><use href="#i-plug"/></svg></div>
    <h2>会话已结束</h2>
    <p class="sub" id="endReason"></p>
    <button class="btn-primary" id="renewBtn">新建终端会话</button>
    <button class="btn-ghost" id="endedBackBtn">返回聊天界面</button>
  </div>
</div>

<div class="overlay" id="pasteOverlay" style="display:none">
  <div class="card">
    <h2>粘贴到终端</h2>
    <p class="sub">当前环境不允许直接读取剪贴板，请在下方粘贴内容。</p>
    <textarea id="pasteBox" placeholder="在此长按粘贴，或按 Ctrl/⌘ + V"></textarea>
    <button class="btn-primary" id="pasteSendBtn">发送至终端</button>
    <button class="btn-ghost" id="pasteCancelBtn">取消</button>
  </div>
</div>

<script>
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

var term = null, fit = null, sessionId = null, currentPid = null, es = null;
var currentFontSize = window.innerWidth < 520 ? 12 : 13.5;

function $(id) { return document.getElementById(id); }

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  return fetch(path, Object.assign({ credentials: 'same-origin' }, opts)).then(function (r) {
    if (!r.ok) {
      return r.json().then(function (j) { throw new Error(j.error || ('HTTP ' + r.status)); });
    }
    return r.json();
  });
}

function b64ToBytes(b64) {
  var bin = atob(b64); var a = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
function bytesToB64(bytes) {
  var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}

function toast(msg) {
  var el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.remove('show'); }, 1700);
}

function copyText(text) {
  text = String(text == null ? '' : text);
  return new Promise(function (resolve, reject) {
    function legacy() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error('execCommand copy failed'));
      } catch (e) { reject(e); }
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(resolve, legacy);
    } else {
      legacy();
    }
  });
}

function bufferText() {
  if (!term) return '';
  var buf = term.buffer.active, lines = [], i, line;
  for (i = 0; i < buf.length; i++) {
    line = buf.getLine(i);
    lines.push(line ? line.translateToString(true) : '');
  }
  while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
  return lines.join('\n');
}

function flashStatus(msg) {
  var el = $('status');
  el.classList.add('flash');
  el._msg = msg;
  updateStatus();
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.remove('flash'); el._msg = null; updateStatus(); }, 1600);
}

function doCopy(text, quiet) {
  if (!text) { if (!quiet) toast('没有可复制的内容'); return; }
  copyText(text).then(function () {
    flashStatus('已复制 ' + text.length + ' 字符');
    if (!quiet) {
      var b = $('copyBtn');
      b.classList.add('done');
      b.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><use href="#i-check"/></svg>';
      clearTimeout(b._t);
      b._t = setTimeout(function () {
        b.classList.remove('done');
        b.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><use href="#i-copy"/></svg>';
      }, 1400);
    }
  }).catch(function () {
    if (!quiet) toast('复制失败，请长按选中后手动复制');
  });
}

function sendToTerm(text) {
  if (!text || !sessionId || !term) return;
  term.paste(text);
  term.focus();
}

function doPaste() {
  if (navigator.clipboard && navigator.clipboard.readText && window.isSecureContext) {
    navigator.clipboard.readText().then(function (t) {
      if (t) { sendToTerm(t); flashStatus('已粘贴 ' + t.length + ' 字符'); }
      else toast('剪贴板为空');
    }).catch(openPasteSheet);
  } else {
    openPasteSheet();
  }
}

function openPasteSheet() {
  $('pasteOverlay').style.display = 'flex';
  var box = $('pasteBox');
  box.value = '';
  setTimeout(function () { box.focus(); }, 60);
}
function closePasteSheet() { $('pasteOverlay').style.display = 'none'; if (term) term.focus(); }

$('pasteSendBtn').onclick = function () {
  var v = $('pasteBox').value;
  closePasteSheet();
  if (v) { sendToTerm(v); flashStatus('已粘贴 ' + v.length + ' 字符'); }
};
$('pasteCancelBtn').onclick = closePasteSheet;

var connState = '';
function updateStatus() {
  var el = $('status');
  var html = '<span class="conn-dot' + (connState ? ' ' + connState : '') + '"></span>';
  if (el._msg) {
    html += '<span>' + el._msg + '</span>';
  } else {
    var parts = [];
    if (currentPid) parts.push('pid ' + currentPid);
    if (term) parts.push(term.cols + '×' + term.rows);
    if (parts.length) html += '<span>' + parts.join('</span><span class="sep">·</span><span>') + '</span>';
  }
  el.innerHTML = html;
}

function setConnState(state) {
  connState = state || '';
  updateStatus();
}

function login() {
  return api('/api/session').then(function (d) {
    if (d.authenticated) return true;
    var initData = tg && tg.initData ? tg.initData : '';
    if (initData) {
      return api('/api/login', { method: 'POST', body: JSON.stringify({ init_data: initData }) })
        .then(function () { return true; });
    }
    return false;
  });
}

function showLogin() { $('loginOverlay').style.display = 'flex'; }
function hideLogin() { $('loginOverlay').style.display = 'none'; }

function startLogin() {
  login().then(function (ok) {
    if (ok) { hideLogin(); initTerm(); }
    else { showLogin(); $('pw').focus(); }
  }).catch(function () { showLogin(); });
}

$('loginBtn').onclick = function () {
  var pw = $('pw').value;
  if (!pw) { $('err').textContent = '请输入密码'; return; }
  api('/api/login', { method: 'POST', body: JSON.stringify({ password: pw }) }).then(function () {
    hideLogin(); initTerm();
  }).catch(function (e) { $('err').textContent = e.message || '登录失败'; });
};
$('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginBtn').click(); });

function openStream() {
  if (es) es.close();
  setConnState('connecting');
  es = new EventSource('/api/term/output?session_id=' + encodeURIComponent(sessionId));
  es.onopen = function () { setConnState(''); };
  es.onmessage = function (ev) {
    try {
      var j = JSON.parse(ev.data);
      if (j.data && term) term.write(b64ToBytes(j.data));
    } catch (e) {}
  };
  es.addEventListener('close', function () { showEnded('终端会话已退出'); });
  es.onerror = function () { setConnState('disconnected'); };
}

var THEME = {
  background: '#08090C', foreground: '#DDE1E9',
  cursor: '#8189FF', cursorAccent: '#08090C',
  selectionBackground: 'rgba(129,137,255,.34)',
  black: '#1C1F27',   red: '#FF6B7E',     green: '#3ECF8E',  yellow: '#F0B429',
  blue: '#8189FF',    magenta: '#C08BFF', cyan: '#4CD6DE',   white: '#C6CBD6',
  brightBlack: '#5A6273', brightRed: '#FF8D9C', brightGreen: '#67E0AA', brightYellow: '#FFC94D',
  brightBlue: '#A0A6FF',  brightMagenta: '#D3A8FF', brightCyan: '#77E4EA', brightWhite: '#F2F4F8'
};

function initTerm() {
  if (term) { term.dispose(); term = null; }
  currentPid = null;
  term = new Terminal({
    fontFamily: '"SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace',
    fontSize: currentFontSize,
    lineHeight: 1.25,
    letterSpacing: 0,
    cursorBlink: true,
    cursorStyle: 'bar',
    scrollback: 8000,
    rightClickSelectsWord: true,
    macOptionIsMeta: true,
    theme: THEME
  });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($('term'));
  try { fit.fit(); } catch (e) {}
  updateStatus();

  term.attachCustomKeyEventHandler(function (e) {
    if (e.type !== 'keydown') return true;
    var mod = e.ctrlKey || e.metaKey;
    if (!mod) return true;
    if (e.code === 'KeyC' && (e.shiftKey || term.hasSelection())) {
      var sel = term.getSelection();
      if (sel) { doCopy(sel); e.preventDefault(); return false; }
      if (e.shiftKey) { e.preventDefault(); return false; }
    }
    if (e.code === 'KeyA' && e.shiftKey) { term.selectAll(); e.preventDefault(); return false; }
    return true;
  });

  var cols = term.cols, rows = term.rows;
  api('/api/term/open', { method: 'POST', body: JSON.stringify({ cols: cols, rows: rows }) })
    .then(function (d) {
      sessionId = d.session_id;
      currentPid = d.pid;
      updateStatus();
      openStream();
      term.focus();
    })
    .catch(function (e) {
      var msg = e.message || '无法创建终端';
      if (msg.indexOf('终端功能未开启') >= 0) {
        msg = '终端功能未开启。请在 Telegram /start → 🌐 Web → 🖥 终端 里开启后重试。';
      }
      showEnded(msg);
    });

  term.onData(function (data) {
    if (!sessionId) return;
    var b = new TextEncoder().encode(data);
    api('/api/term/input', { method: 'POST', body: JSON.stringify({ session_id: sessionId, data: bytesToB64(b) }) })
      .catch(function () {});
  });
  term.onResize(function (s) {
    if (!sessionId) return;
    api('/api/term/resize', { method: 'POST', body: JSON.stringify({ session_id: sessionId, cols: s.cols, rows: s.rows }) })
      .catch(function () {});
    updateStatus();
  });
}

var vkeys = document.querySelectorAll('.vkey');
Array.prototype.forEach.call(vkeys, function (k) {
  k.addEventListener('click', function () {
    var val = k.dataset.key;
    if (val && term) {
      term.paste(val);
      term.focus();
    }
  });
});

$('fontPlusBtn').onclick = function () {
  if (!term || currentFontSize >= 24) return;
  currentFontSize += 1.5;
  term.options.fontSize = currentFontSize;
  try { fit.fit(); } catch (e) {}
  updateStatus();
};
$('fontMinusBtn').onclick = function () {
  if (!term || currentFontSize <= 10) return;
  currentFontSize -= 1.5;
  term.options.fontSize = currentFontSize;
  try { fit.fit(); } catch (e) {}
  updateStatus();
};

$('term').addEventListener('mouseup', function () {
  if (!term || !term.hasSelection()) return;
  var sel = term.getSelection();
  if (sel && sel.trim()) doCopy(sel, true);
});
window.addEventListener('resize', function () { if (fit) { try { fit.fit(); } catch (e) {} } });

function showEnded(reason) {
  if (es) { es.close(); es = null; }
  sessionId = null;
  $('endReason').textContent = reason || '';
  $('endedOverlay').style.display = 'flex';
}

function goBackToChat() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'xgent-close-terminal' }, '*');
    return;
  }
  if (window.opener && !window.opener.closed) {
    window.opener.focus();
    window.close();
  } else {
    location.href = '/';
  }
}

$('copyBtn').onclick = function () {
  var sel = term && term.hasSelection() ? term.getSelection() : '';
  doCopy(sel && sel.trim() ? sel : bufferText());
};
$('pasteBtn').onclick = doPaste;
$('closeBtn').onclick = function () {
  if (sessionId) {
    api('/api/term/close', { method: 'POST', body: JSON.stringify({ session_id: sessionId }) }).catch(function () {});
  }
  showEnded('已手动关闭');
};
$('backBtn').onclick = goBackToChat;
$('endedBackBtn').onclick = goBackToChat;
$('renewBtn').onclick = function () {
  $('endedOverlay').style.display = 'none';
  if (term) { term.dispose(); term = null; }
  initTerm();
};

startLogin();
</script>
</body>
</html>
