<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XGent Terminal</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #17212b; color: #e9edf0;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  #bar {
    height: 44px; display: flex; align-items: center; padding: 0 12px;
    background: #1c2733; border-bottom: 1px solid #0e1621;
    position: relative; z-index: 2;
  }
  #bar .title { font-weight: 600; font-size: 15px; flex: 1; }
  #bar button {
    background: transparent; color: #e9edf0; border: 1px solid #2b3a47;
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  #bar button:hover { background: #243341; }
  #bar button.back-btn { border: none; padding: 6px 8px; font-size: 18px; line-height: 1; }
  #term-wrap { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; padding: 6px; }
  #term { width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0; background: rgba(14, 22, 33, 0.96);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  .card {
    background: #1c2733; border: 1px solid #2b3a47; border-radius: 12px;
    padding: 24px; width: min(360px, 90vw);
  }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .card input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2b3a47;
    background: #17212b; color: #e9edf0; font-size: 14px; margin-bottom: 12px;
  }
  .card button {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    background: #5288c1; color: #fff; font-size: 14px; cursor: pointer;
  }
  .muted { color: #7d8e9e; font-size: 12px; margin-top: 8px; line-height: 1.5; }
  #err { color: #e57676; font-size: 13px; margin-top: 8px; min-height: 18px; }
  #status {
    position: absolute; bottom: 6px; right: 10px; font-size: 11px;
    color: #7d8e9e; z-index: 3; pointer-events: none;
  }
</style>
</head>
<body>
<div id="bar">
  <button class="back-btn" id="backBtn" title="返回聊天">←</button>
  <span class="title">🖥 终端</span>
  <button id="closeBtn">关闭会话</button>
</div>
<div id="term-wrap"><div id="term"></div></div>
<div id="status"></div>

<div class="overlay" id="loginOverlay">
  <div class="card">
    <h2>🔐 终端登录</h2>
    <input id="pw" type="password" placeholder="访问密码">
    <button id="loginBtn">登录</button>
    <div id="err"></div>
    <div class="muted">终端仅授权用户可用。在 Telegram 内打开时自动免密。</div>
  </div>
</div>

<div class="overlay" id="endedOverlay" style="display:none">
  <div class="card">
    <h2>会话已结束</h2>
    <button id="renewBtn">新建会话</button>
    <button id="endedBackBtn" style="margin-top:8px;background:transparent;border:none;color:#5288c1;font:inherit;cursor:pointer;">← 返回聊天</button>
    <div class="muted" id="endReason"></div>
  </div>
</div>

<script>
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

var term = null, fit = null, sessionId = null, currentPid = null, es = null;

function $(id) { return document.getElementById(id); }

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  return fetch(path, Object.assign({ credentials: 'same-origin' }, opts)).then(function (r) {
    if (!r.ok) {
      return r.json().then(function (j) { throw new Error(j.error || ('HTTP ' + r.status)); });
    }
    return r.json();
  });
}

function b64ToBytes(b64) {
  var bin = atob(b64); var a = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
function bytesToB64(bytes) {
  var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}

function updateStatus() {
  $('status').textContent = (currentPid ? ('pid ' + currentPid + ' · ') : '') +
    (term ? (term.cols + '×' + term.rows) : '');
}

function login() {
  return api('/api/session').then(function (d) {
    if (d.authenticated) return true;
    var initData = tg && tg.initData ? tg.initData : '';
    if (initData) {
      return api('/api/login', { method: 'POST', body: JSON.stringify({ init_data: initData }) })
        .then(function () { return true; });
    }
    return false;
  });
}

function showLogin() { $('loginOverlay').style.display = 'flex'; }
function hideLogin() { $('loginOverlay').style.display = 'none'; }

function startLogin() {
  login().then(function (ok) {
    if (ok) { hideLogin(); initTerm(); }
    else { showLogin(); $('pw').focus(); }
  }).catch(function () { showLogin(); });
}

$('loginBtn').onclick = function () {
  var pw = $('pw').value;
  if (!pw) { $('err').textContent = '请输入密码'; return; }
  api('/api/login', { method: 'POST', body: JSON.stringify({ password: pw }) }).then(function () {
    hideLogin(); initTerm();
  }).catch(function (e) { $('err').textContent = e.message || '登录失败'; });
};
$('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginBtn').click(); });

function openStream() {
  if (es) es.close();
  es = new EventSource('/api/term/output?session_id=' + encodeURIComponent(sessionId));
  es.onmessage = function (ev) {
    try {
      var j = JSON.parse(ev.data);
      if (j.data && term) term.write(b64ToBytes(j.data));
    } catch (e) {}
  };
  es.addEventListener('close', function () { showEnded('终端会话已退出'); });
  es.onerror = function () {
    // EventSource 默认自动重连，但终端会话一旦断了重连也拿不到旧输出，
    // 关掉由 close 事件 / 主动检测处理。
  };
}

function initTerm() {
  if (term) { term.dispose(); term = null; }
  currentPid = null;
  term = new Terminal({
    fontFamily: 'Menlo, Consolas, "Courier New", monospace',
    fontSize: 14, cursorBlink: true, scrollback: 5000,
    theme: {
      background: '#17212b', foreground: '#e9edf0', cursor: '#e9edf0',
      selectionBackground: 'rgba(82,136,193,0.4)'
    }
  });
  fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($('term'));
  try { fit.fit(); } catch (e) {}
  updateStatus();

  var cols = term.cols, rows = term.rows;
  api('/api/term/open', { method: 'POST', body: JSON.stringify({ cols: cols, rows: rows }) })
    .then(function (d) {
      sessionId = d.session_id;
      currentPid = d.pid;
      updateStatus();
      openStream();
    })
    .catch(function (e) {
      var msg = e.message || '无法创建终端';
      if (msg.indexOf('终端功能未开启') >= 0) {
        msg = '终端功能未开启。请在 Telegram /start → 🌐 Web → 🖥 终端 里开启后重试。';
      }
      showEnded(msg);
    });

  term.onData(function (data) {
    if (!sessionId) return;
    var b = new TextEncoder().encode(data);
    api('/api/term/input', { method: 'POST', body: JSON.stringify({ session_id: sessionId, data: bytesToB64(b) }) })
      .catch(function () {});
  });
  term.onResize(function (s) {
    if (!sessionId) return;
    api('/api/term/resize', { method: 'POST', body: JSON.stringify({ session_id: sessionId, cols: s.cols, rows: s.rows }) })
      .catch(function () {});
    updateStatus();
  });
  window.addEventListener('resize', function () { if (fit) { try { fit.fit(); } catch (e) {} } });
}

function showEnded(reason) {
  if (es) { es.close(); es = null; }
  sessionId = null;
  $('endReason').textContent = reason || '';
  $('endedOverlay').style.display = 'flex';
}

$('closeBtn').onclick = function () {
  if (sessionId) {
    api('/api/term/close', { method: 'POST', body: JSON.stringify({ session_id: sessionId }) }).catch(function () {});
  }
  showEnded('已手动关闭');
};
$('backBtn').onclick = function () { location.href = '/'; };
$('endedBackBtn').onclick = function () { location.href = '/'; };
$('renewBtn').onclick = function () {
  $('endedOverlay').style.display = 'none';
  if (term) { term.dispose(); term = null; }
  initTerm();
};

startLogin();
</script>
</body>
</html>
