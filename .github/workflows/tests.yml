name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_split_integrity.py
      - run: python -m compileall -q bot_server.py telegram_ai_bot
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh skill/script/mailu-helper/mailu-helper.sh skill/script/notes/install.sh skill/script/proxy-setup/proxy_setup.sh skill/script/webdav-filemanager/install.sh
