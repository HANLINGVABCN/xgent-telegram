name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 代码使用 zoneinfo 和 str.removesuffix（3.9+），install.sh 的门槛是 3.10。
        python-version: ["3.10", "3.11", "3.12"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest pytest-xdist pytest-split
      - run: python tools/check_split_integrity.py
      - run: python -m compileall -q xgent_server.py xgent_app
      # compileall 对不存在的目录也可能返回 0，先显式确认目录存在。
      - run: test -d skill-public/script && python -m compileall -q tools tests skill-public/script
      - run: pytest --splits 4 --group ${{ matrix.shard }}
      # bash -n 只解析第一个脚本，其余参数不会被检查。
      - run: |
          set -e
          for script in install.sh skill-public/script/mailu-helper/mailu-helper.sh skill-public/script/notes/install.sh skill-public/script/proxy-setup/proxy_setup.sh skill-public/script/webdav-filemanager/install.sh; do
            test -f "$script"
            bash -n "$script"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ruff
      # 只查真正的错误类（未定义名、语法错、明显 bug），不做风格强制。
      # sections/ 通过共享命名空间加载，跨文件符号必然「未定义」，故排除。
      - run: ruff check --select E9,F63,F7,F82 --exclude xgent_app/sections .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pip-audit
      # 依赖有已知漏洞时失败；仅作提示不阻塞时可加 || true
      - run: pip-audit -r requirements.txt
